<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora de Importaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>

<style>
  :root{
    color-scheme: light;
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --surface-2: #EDF1F5;
    --surface-3: #E3E9EF;
    --border: #D7DEE6;
    --text: #16212C;
    --text-muted: #5B6B7A;
    --text-faint: #8A97A5;
    --accent: #0E5C68;
    --accent-strong: #0A4750;
    --accent-soft: #DCEEF0;
    --success: #1E8A4C;
    --success-soft: #DEF3E4;
    --success-strong:#12592F;
    --warning: #A6710E;
    --warning-soft: #FBEED2;
    --warning-strong:#6E4A08;
    --info: #2360AC;
    --info-soft: #DCE9FB;
    --info-strong:#173F73;
    --neutral-stage: #5B6472;
    --neutral-stage-soft: #E7E9EC;
    --danger: #B23A2E;
    --danger-soft: #F8DEDA;
    --shadow: 0 1px 2px rgba(16,24,32,.06), 0 4px 14px rgba(16,24,32,.05);
    --radius-s: 6px;
    --radius-m: 10px;
    --font-display: 'Space Grotesk', 'IBM Plex Sans', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #10161C;
      --surface: #171F27;
      --surface-2: #1D2731;
      --surface-3: #26313C;
      --border: #2F3B47;
      --text: #E7EDF2;
      --text-muted: #9FB0BE;
      --text-faint: #6D7C8A;
      --accent: #3FB6C4;
      --accent-strong: #6FCBD6;
      --accent-soft: #163841;
      --success: #4BC17E;
      --success-soft: #163828;
      --success-strong:#8FE0B1;
      --warning: #E0AC4C;
      --warning-soft: #3B2E12;
      --warning-strong:#F2CB84;
      --info: #6FA6E8;
      --info-soft: #16273F;
      --info-strong:#A9C7F1;
      --neutral-stage:#9AA5B1;
      --neutral-stage-soft:#242C34;
      --danger: #E17A6B;
      --danger-soft: #3C1E1A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #10161C;
    --surface: #171F27;
    --surface-2: #1D2731;
    --surface-3: #26313C;
    --border: #2F3B47;
    --text: #E7EDF2;
    --text-muted: #9FB0BE;
    --text-faint: #6D7C8A;
    --accent: #3FB6C4;
    --accent-strong: #6FCBD6;
    --accent-soft: #163841;
    --success: #4BC17E;
    --success-soft: #163828;
    --success-strong:#8FE0B1;
    --warning: #E0AC4C;
    --warning-soft: #3B2E12;
    --warning-strong:#F2CB84;
    --info: #6FA6E8;
    --info-soft: #16273F;
    --info-strong:#A9C7F1;
    --neutral-stage:#9AA5B1;
    --neutral-stage-soft:#242C34;
    --danger: #E17A6B;
    --danger-soft: #3C1E1A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body); font-size:14px; line-height:1.45;
    padding-inline:0;
  }
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; letter-spacing:-.01em;}
  .mono{font-family:var(--font-mono); font-variant-numeric: tabular-nums;}
  button{font-family:inherit; font-size:13px;}
  input,select,textarea{font-family:inherit; font-size:13px; color:var(--text); background:var(--surface);}
  a{color:var(--accent);}
  ::-webkit-scrollbar{height:10px; width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

  #app{display:flex; flex-direction:column; height:100%;}

  header.topbar{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:var(--surface); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:40;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:8px;}
  .brand-mark{
    width:34px; height:34px; border-radius:8px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:15px;
    flex:none;
  }
  .brand-text h1{font-size:16px;}
  .brand-text span{font-size:11px; color:var(--text-muted); display:block; margin-top:1px;}

  nav.tabs{display:flex; gap:2px; flex-wrap:wrap; flex:1;}
  nav.tabs button{
    border:1px solid transparent; background:transparent; color:var(--text-muted);
    padding:8px 12px; border-radius:var(--radius-s); cursor:pointer; font-weight:500;
    white-space:nowrap;
  }
  nav.tabs button:hover{background:var(--surface-2); color:var(--text);}
  nav.tabs button.active{background:var(--accent-soft); color:var(--accent-strong); font-weight:600;}

  .topbar-actions{display:flex; align-items:center; gap:8px;}
  .status-pill{
    font-size:11px; padding:4px 9px; border-radius:99px; border:1px solid var(--border); color:var(--text-muted);
    display:flex; align-items:center; gap:6px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--success);}
  .dot.bad{background:var(--danger);}
  .dot.pending{background:var(--warning);}

  main{flex:1; overflow:auto; padding:20px; padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));}
  .view{display:none; max-width:1400px; margin:0 auto; flex-direction:column; gap:18px;}
  .view.active{display:flex;}

  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;}
  .kpi{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:14px 16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px;
  }
  .kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:600;}
  .kpi .value{font-family:var(--font-display); font-size:24px; font-weight:700;}
  .kpi .sub{font-size:11.5px; color:var(--text-faint);}
  .kpi.accent-success .value{color:var(--success);}
  .kpi.accent-warning .value{color:var(--warning);}
  .kpi.accent-info .value{color:var(--info);}

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:14px 16px; border-bottom:1px solid var(--border);
  }
  .panel-head h2{font-size:15px;}
  .panel-head .desc{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .panel-body{padding:14px 16px;}
  .panel-body.flush{padding:0;}

  .toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; border-radius:var(--radius-s);
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:7px 12px; cursor:pointer; font-weight:500; white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-strong);}
  .btn.danger{color:var(--danger); border-color:var(--danger-soft);}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn.small{padding:5px 9px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  input.field, select.field{
    border:1px solid var(--border); border-radius:var(--radius-s); padding:7px 9px; background:var(--surface); color:var(--text);
  }
  input.field:focus, select.field:focus, textarea.field:focus{outline:2px solid var(--accent); outline-offset:1px;}

  table.grid{border-collapse:collapse; width:100%; min-width:max-content;}
  table.grid thead th{
    position:sticky; top:0; background:var(--surface-2); text-align:left; font-size:11px;
    text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600;
    padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap; z-index:2;
  }
  table.grid tbody td{
    padding:6px 10px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:13px;
  }
  table.grid tbody tr:hover td{background:var(--surface-2);}
  table.grid tbody tr.row-selected td{background:var(--accent-soft);}
  table.grid input.cell, table.grid select.cell{
    border:1px solid transparent; background:transparent; width:100%; padding:5px 6px; border-radius:5px; color:var(--text);
  }
  table.grid input.cell:hover, table.grid select.cell:hover{border-color:var(--border);}
  table.grid input.cell:focus, table.grid select.cell:focus{border-color:var(--accent); background:var(--surface); outline:none;}
  .table-scroll{overflow:auto; max-height:62vh;}

  /* Tabla de Liquidación Incoterm con columnas configurables (mostrar/ocultar) y
     redimensionables (arrastrar el borde derecho del encabezado) -- a pedido de Juan Camilo. */
  table.lq-resizable{table-layout:fixed;}
  table.lq-resizable thead th{white-space:normal; overflow-wrap:break-word; line-height:1.3;}
  table.lq-resizable tbody td{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .col-resize-handle{
    position:absolute; top:0; right:0; bottom:0; width:8px; cursor:col-resize; user-select:none; touch-action:none;
  }
  .col-resize-handle:hover, .col-resize-handle:active{background:var(--accent-soft);}

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
    font-size:11.5px; font-weight:600; white-space:nowrap;
  }
  .badge.success{background:var(--success-soft); color:var(--success-strong);}
  .badge.warning{background:var(--warning-soft); color:var(--warning-strong);}
  .badge.info{background:var(--info-soft); color:var(--info-strong);}
  .badge.neutral{background:var(--neutral-stage-soft); color:var(--neutral-stage);}
  .badge.danger{background:var(--danger-soft); color:var(--danger);}
  .badge .dot{width:6px;height:6px;}

  tr.row-success{box-shadow:inset 4px 0 0 var(--success);}
  tr.row-warning{box-shadow:inset 4px 0 0 var(--warning);}
  tr.row-info{box-shadow:inset 4px 0 0 var(--info);}
  tr.row-neutral{box-shadow:inset 4px 0 0 var(--neutral-stage);}

  .filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .empty{padding:30px 16px; text-align:center; color:var(--text-faint); font-size:13px;}

  .drop-zone{
    border:2px dashed var(--border); border-radius:var(--radius-m); padding:30px 16px; text-align:center;
    color:var(--text-muted); cursor:pointer; transition:border-color .15s, background .15s;
  }
  .drop-zone.drag{border-color:var(--accent); background:var(--accent-soft);}
  .drop-zone strong{color:var(--text);}

  .invoice-card{
    border:1px solid var(--border); border-radius:var(--radius-m); padding:14px; background:var(--surface-2);
    display:flex; flex-direction:column; gap:10px;
  }
  .invoice-card .row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px;}
  .field-label{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); font-weight:600; margin-bottom:3px; display:block;}
  .invoice-card .status-line{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
  .confidence{font-size:11.5px; color:var(--text-faint);}

  .waterfall{display:flex; flex-direction:column; gap:10px;}
  .wf-row{display:grid; grid-template-columns:170px 1fr auto; gap:12px; align-items:center;}
  .wf-label{font-size:12.5px; color:var(--text-muted); font-weight:600;}
  .wf-track{background:var(--surface-3); border-radius:6px; height:20px; overflow:hidden; display:flex;}
  .wf-fill{height:100%;}
  .wf-value{font-family:var(--font-mono); font-size:13px; text-align:right; min-width:130px;}

  .toast-wrap{position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:100;}
  .toast{
    background:var(--text); color:var(--bg); padding:10px 14px; border-radius:var(--radius-s); font-size:13px;
    box-shadow:var(--shadow); max-width:320px;
  }
  .toast.err{background:var(--danger);}
  .toast.ok{background:var(--success);}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,15,20,.45); display:flex; align-items:center; justify-content:center;
    z-index:90; padding:20px;
  }
  .modal{
    background:var(--surface); border-radius:var(--radius-m); border:1px solid var(--border); box-shadow:var(--shadow);
    max-width:640px; width:100%; max-height:86vh; overflow:auto; padding:18px;
  }
  .modal h3{margin-bottom:10px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:640px){ .grid2{grid-template-columns:1fr;} }
  .helptext{font-size:12px; color:var(--text-faint); margin-top:8px; line-height:1.5;}

  footer.appfoot{padding:12px 20px; text-align:center; font-size:11.5px; color:var(--text-faint);}

  /* Login / acceso -- a pedido de Juan Camilo (usuarios con Supabase Auth, roles admin/lectura) */
  .auth-screen{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
  .auth-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:var(--shadow); padding:28px; max-width:380px; width:100%;}
  .auth-card .brand-mark{margin:0 auto 14px}
  .auth-card h1{font-size:19px; text-align:center; margin-bottom:4px;}
  .auth-card .auth-sub{color:var(--text-muted); font-size:13px; margin-bottom:16px; text-align:center;}
  .auth-card label.field-label{display:block}
  .auth-card input.field{width:100%}
</style>
</head>
<body>

<div id="authScreen" class="auth-screen" style="display:none"></div>

<div id="app" style="display:none">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">IM</div>
      <div class="brand-text">
        <h1>Bitácora de Importaciones</h1>
        <span>Seguimiento, costeo Incoterm y facturación</span>
      </div>
    </div>
    <nav class="tabs" id="tabNav">
      <button data-view="resumen" class="active">Resumen</button>
      <button data-view="embarques">Seguimiento de Embarques</button>
      <button data-view="financiero">Control Financiero</button>
      <button data-view="incoterm">Liquidación Incoterm</button>
      <button data-view="facturas">Importar Facturas</button>
      <button data-view="proveedores">Proveedores y Conceptos</button>
      <button data-view="lecturadi">Lectura DI</button>
      <button data-view="usuarios" id="navUsuarios" style="display:none">Configuración</button>
    </nav>
    <div class="topbar-actions">
      <span class="status-pill" id="connStatus"><span class="dot pending"></span> Conectando…</span>
      <span class="badge neutral" id="userBadge" style="display:none"></span>
      <button class="btn small" id="refreshBtn" title="Actualizar los datos desde Supabase" style="display:none">⟳ Actualizar</button>
      <button class="btn small" id="signOutBtn" style="display:none">Cerrar sesión</button>
    </div>
  </header>

  <main id="main">
    <!-- RESUMEN -->
    <section class="view active" id="view-resumen"></section>
    <!-- EMBARQUES -->
    <section class="view" id="view-embarques"></section>
    <!-- FINANCIERO -->
    <section class="view" id="view-financiero"></section>
    <!-- INCOTERM -->
    <section class="view" id="view-incoterm"></section>
    <!-- FACTURAS -->
    <section class="view" id="view-facturas"></section>
    <!-- PROVEEDORES -->
    <section class="view" id="view-proveedores"></section>
    <section class="view" id="view-lecturadi"></section>
    <!-- USUARIOS (solo admin) -->
    <section class="view" id="view-usuarios"></section>
  </main>

  <footer class="appfoot">Datos almacenados en Supabase · Los cálculos de arancel/IVA/liquidación son de apoyo — verifícalos contra tus documentos de nacionalización.</footer>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SUPABASE_URL = "https://zmgitsmngdjpacvrxfkx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptZ2l0c21uZ2RqcGFjdnJ4Zmt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNzE5MzUsImV4cCI6MjA5ODk0NzkzNX0.8ZcQB0LCbClGtoPnIXqAT5NAzb4b6CKEcO8TzyKm2c0";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const BUCKET = "impo-facturas";
const BUCKET_DI = "impo-lecturas-di";

const ESTADO_IMPO_OPTS = ["Espera de reserva","Reserva confirmada","Emisión pendiente","En tránsito","En puerto","Nacionalización","Entregado","Cerrado"];
const ESTADO_PAGO_OPTS = ["Pendiente","Cancelado"];
const INCOTERM_OPTS = ["EXW","FCA","FAS","FOB","CFR","CIF","CPT","CIP","DAP","DPU","DDP"];
const ETAPA_INCOTERM_OPTS = [
  "Origen (EXW-FCA)",
  "Flete Internacional (FOB-CIF)",
  "Puerto Destino / Nacionalización (CIF-DAP-DDP)",
  "Transporte Interno / Entrega Final (DDP)"
];
const SUCURSAL_OPTS = ["GP","GPA","GPO","GPM","CTG","MP","BOOM","VIPC","VIPI","SIN ASIGNAR","MCHC","GPY"];

// Cruce automático Control Financiero -> Liquidación Incoterm. Cada factura/rubro de BD
// Importaciones se clasifica en uno de estos dos tipos:
//  - "mercancia": la factura comercial del proveedor de la mercancía (FOB/Flete/Seguro en
//    USD) -> alimenta impo_datos_mercancia.
//  - "servicio": una factura de costo/servicio de importación en Colombia (naviera, agencia
//    de aduanas, transporte, bancos) -> alimenta un rubro puntual de impo_costo_mercancia,
//    indicado en RUBRO_COSTO_MERCANCIA_OPTS (debe coincidir exactamente con una columna real
//    de esa tabla). Una factura de servicio sin rubro asignado NO se suma automáticamente.
const TIPO_FACTURA_OPTS = [
  {value:'servicio', label:'Servicio / costo de importación'},
  {value:'mercancia', label:'Mercancía (factura comercial del proveedor)'},
];
const RUBRO_COSTO_MERCANCIA_OPTS = [
  {value:'arancel', label:'Arancel'},
  {value:'iva', label:'IVA (nacionalización)'},
  {value:'sanciones', label:'Sanciones'},
  {value:'flete_internacional', label:'Flete internacional (factura)'},
  {value:'servicios_jas', label:'Servicios agente (aduanas)'},
  {value:'puerto_alm_reconocimiento', label:'Puerto / Almacenaje / Reconocimiento'},
  {value:'flete_terrestre', label:'Flete terrestre'},
  {value:'gtos_bancarios_4x1000', label:'4x1000 / Gastos bancarios'},
  {value:'costo_logistica_cta_impo', label:'Costo logística - Cta Impo'},
  {value:'gtos_cofa', label:'Gastos COFA'},
];
const RUBRO_COSTO_MERCANCIA_LABEL = Object.fromEntries(RUBRO_COSTO_MERCANCIA_OPTS.map(o=>[o.value,o.label]));

// Mapeo de color por estado de importación (verde=finalizado, amarillo=puerto, azul=tránsito, gris=pre-embarque)
const ESTADO_COLOR = {
  "Espera de reserva": "neutral",
  "Reserva confirmada": "neutral",
  "Emisión pendiente": "neutral",
  "En tránsito": "info",
  "En puerto": "warning",
  "Nacionalización": "warning",
  "Entregado": "success",
  "Cerrado": "success",
};

const money = (n, decimals=0) => {
  n = Number(n)||0;
  return n.toLocaleString('es-CO', {minimumFractionDigits:decimals, maximumFractionDigits:decimals});
};
const moneyUSD = (n) => "US$ " + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const moneyCOP = (n) => "$ " + money(n,0);
const fmtDate = (d) => {
  if(!d) return "";
  const dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('es-CO', {day:'2-digit',month:'short',year:'numeric'});
};
const todayISO = () => new Date().toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);

// TRM (tasa representativa del mercado) editable por el usuario, por BL — se guarda en
// impo_datos_mercancia.trm. Se usa para poder ver la liquidación de cada importación tanto
// en COP como en USD, sin asumir una TRM global: cada BL puede tener la suya (fecha de giro
// distinta, factura distinta, etc.).
function getTrmForBl(bl){
  const dm = STATE.datosMercancia.find(r=>r.bl===bl);
  return dm ? Number(dm.trm||0) : 0;
}
// Muestra un valor en COP convirtiéndolo a USD con la TRM del BL cuando currency==='USD'.
// Si el BL no tiene TRM cargada, se avisa en vez de inventar un valor.
function moneyDual(valueCOP, trm, currency){
  if(currency === 'USD'){
    if(!trm) return `<span style="color:var(--text-muted)" title="Este BL no tiene TRM cargada todavía">— (sin TRM)</span>`;
    return moneyUSD(Number(valueCOP||0) / trm);
  }
  return moneyCOP(valueCOP);
}

    <button type="button" class="seg-btn${current==='USD'?' active':''}" data-currency="USD" style="padding:5px 12px;font-size:12px;border:none;cursor:pointer;background:${current==='USD'?'var(--accent)':'transparent'};color:${current==='USD'?'#fff':'inherit'}">USD</button>
  </div>`;
}

function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
}

let CURRENT_USER = null; // {id, email, rol} una vez autenticado y verificado
const EDGE_FN_GESTION_USUARIOS = `${SUPABASE_URL}/functions/v1/impo-gestion-usuarios`;

function isAdminUser(){ return !!(CURRENT_USER && CURRENT_USER.rol === 'admin'); }

async function callGestionUsuarios(payload){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) throw new Error('No hay sesión activa');
  const res = await fetch(EDGE_FN_GESTION_USUARIOS, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + session.access_token,
      'apikey': SUPABASE_ANON_KEY,
    },
    body: JSON.stringify(payload),
  });
  let body;
  try{ body = await res.json(); }catch(e){ body = {error:'Respuesta inválida del servidor'}; }
  if(!res.ok) throw new Error(body.error || ('Error '+res.status));
  return body;
}

/* Bloqueo de escritura para rol "lectura": deshabilita los campos editables de
   las grillas (input.cell/select.cell), el detalle de Liquidación Incoterm
   (data-lqtable) y los botones de crear/importar/eliminar/guardar más
   relevantes. Es una ayuda de interfaz -- el límite real y autoritativo es la
   política RLS en Supabase (un usuario de solo lectura no puede escribir aunque
   algún campo se escape de este bloqueo; en ese caso vería el error de la base
   de datos al intentar guardar, nunca una escritura silenciosa). Se reaplica
   automáticamente después de cada repintado con un MutationObserver, porque
   las vistas regeneran su HTML por dentro (no solo al cambiar de pestaña).
   ============================================================ */
function lockReadOnlyUI(){
  if(!isReadOnly()) return;
  document.querySelectorAll('#main input.cell, #main select.cell, #main textarea.cell, #main [data-lqtable], #modalRoot input.cell, #modalRoot select.cell, #modalRoot [data-lqtable]').forEach(el=>{
    el.disabled = true;
  });
  document.querySelectorAll('[data-action="del-emb"], [data-action="del-bd"], [data-action="del-prov"], [data-action="guardar-pdf"], [data-action="descartar-pdf"], [data-action="guardar-di"], [data-action="descartar-di"], [data-action="del-di"]').forEach(el=>{
    el.disabled = true; el.title = 'Tu usuario es de solo lectura';
  });
  ['embAddRow','embImportBtn','embImportFile','bdAddRow','provAdd','lqAdd','lqDeleteBL','lqNewConfirm','diAddItemRow'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ el.disabled = true; el.title = 'Tu usuario es de solo lectura'; }
  });
  ['pdfDrop','diDrop'].forEach(id=>{
    const dropZone = document.getElementById(id);
    if(dropZone){ dropZone.style.opacity = '0.5'; dropZone.style.pointerEvents = 'none'; }
  });
  ['pdfInput','diInput'].forEach(id=>{
    const input = document.getElementById(id);
    if(input) input.disabled = true;
  });
}

let readOnlyObserver = null;
function startReadOnlyGuard(){
  if(!isReadOnly()) return;
  lockReadOnlyUI();
  if(readOnlyObserver) return;
  readOnlyObserver = new MutationObserver(()=>{ lockReadOnlyUI(); });
  const main = document.getElementById('main');
  const modalRoot = document.getElementById('modalRoot');
  if(main) readOnlyObserver.observe(main, {childList:true, subtree:true});
  if(modalRoot) readOnlyObserver.observe(modalRoot, {childList:true, subtree:true});
}

async function bootAfterAuth(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ showAuthScreen('login'); return; }
  const {data:perfil, error} = await sb.from('impo_perfiles').select('id,email,rol').eq('id', session.user.id).maybeSingle();
  if(error){
    showAuthScreen('login', {error: 'No se pudo verificar tu acceso: ' + error.message});
    return;
  }
  if(!perfil){
    showAuthScreen('denied', {email: session.user.email});
    return;
  }
  CURRENT_USER = perfil;
  showApp();
  renderUserChrome();
  try{
    await refreshAll();
    setConn(true, `Conectado · ${STATE.embarques.length} embarques`);
  }catch(err){
    console.error(err);
    setConn(false, 'Sin conexión a la base de datos');
    toast('No se pudo conectar a Supabase: '+err.message, 'err');
  }
  activateView('resumen');
  startReadOnlyGuard();
}

/* ============================================================
   DATA LAYER — helpers thin wrappers over supabase-js
   ============================================================ */
const DB = {
  async list(table, {order=null, ascending=true} = {}){
    let q = sb.from(table).select('*');
    if(order) q = q.order(order, {ascending});
    const {data, error} = await q;
    if(error){ toast('Error cargando '+table+': '+error.message, 'err'); console.error(error); return []; }
    return data || [];
  },
  async insert(table, row){
    const {data, error} = await sb.from(table).insert(row).select();
    if(error){ toast('Error creando registro: '+error.message, 'err'); console.error(error); return null; }
    return data[0];
  },
  async update(table, id, patch){
    const {data, error} = await sb.from(table).update(patch).eq('id', id).select();
    if(error){ toast('Error guardando: '+error.message, 'err'); console.error(error); return null; }
    return data && data[0];
  },
  async remove(table, id){
    const {error} = await sb.from(table).delete().eq('id', id);
    if(error){ toast('Error eliminando: '+error.message, 'err'); console.error(error); return false; }
    return true;
  }
};

/* Global in-memory cache, re-fetched per view */
const STATE = {
  embarques: [],
  bdImportaciones: [],
  proveedores: [],
  facturas: [],
  datosMercancia: [],
  costoMercancia: [],
  lecturasDi: [],
  lecturasDiItems: [],
};

/* ============================================================
   ALERTA DE LLEGADA — replica la fórmula de ESTADO_DE_IMP.xlsm
   =IF(ETA="","SIN FECHA ETA",
      IF(dias<0,"LLEGADA CUMPLIDA",
      IF(dias<=5,"ALERTA 5 DÍAS", IF(dias<=10,"ALERTA 10 DÍAS",
      IF(dias<=15,"ALERTA 15 DÍAS", IF(dias<=20,"ALERTA 20 DÍAS","EN TRÁNSITO"))))))
   ============================================================ */
function alertaLlegada(fechaArribo){
  if(!fechaArribo) return {label:"SIN FECHA ETA", cls:"neutral", dias:null};
  const dias = daysBetween(todayISO(), fechaArribo);
  if(dias < 0) return {label:"LLEGADA CUMPLIDA", cls:"success", dias};
  if(dias <= 5) return {label:`ALERTA 5 DÍAS (${dias}d)`, cls:"danger", dias};
  if(dias <= 10) return {label:`ALERTA 10 DÍAS (${dias}d)`, cls:"warning", dias};
  if(dias <= 15) return {label:`ALERTA 15 DÍAS (${dias}d)`, cls:"warning", dias};
  if(dias <= 20) return {label:`ALERTA 20 DÍAS (${dias}d)`, cls:"info", dias};
  return {label:"EN TRÁNSITO", cls:"info", dias};
}

async function refreshAll(){
  const [embarques, bd, prov, fact, dm, cm, lecturasDi, lecturasDiItems] = await Promise.all([
    DB.list('impo_embarques', {order:'fecha_arribo'}),
    DB.list('impo_bd_importaciones', {order:'fecha'}),
    DB.list('impo_proveedores_conceptos', {order:'proveedor'}),
    DB.list('impo_facturas', {order:'created_at'}),
    DB.list('impo_datos_mercancia', {order:'bl'}),
    DB.list('impo_costo_mercancia', {order:'bl'}),
    DB.list('impo_lecturas_di', {order:'created_at'}),
    DB.list('impo_lecturas_di_items', {order:'orden'}),
  ]);
  STATE.embarques = embarques;
  STATE.bdImportaciones = bd;
  STATE.proveedores = prov;
  STATE.facturas = fact;
  STATE.datosMercancia = dm;
  STATE.costoMercancia = cm;
  STATE.lecturasDi = lecturasDi;
  STATE.lecturasDiItems = lecturasDiItems;
}

async function init(){
  sb.auth.onAuthStateChange((event)=>{
    if(event === 'SIGNED_OUT'){

  }
}

<script>
/* ============================================================
   VISTA: RESUMEN
   ============================================================ */
/* Filtro de rango de fechas del Resumen. Se conserva entre repintados/cambios de
   pestaña dentro de la misma sesión del navegador (no se guarda en la base de datos). */
let resumenDateField = 'fecha_arribo';
let resumenDesde = '';
let resumenHasta = '';

function inDateRange(dateStr, desde, hasta){
  if(!dateStr) return false;
  if(desde && dateStr < desde) return false;
  if(hasta && dateStr > hasta) return false;
  return true;
}

VIEWS.resumen = function(){
  const el = document.getElementById('view-resumen');
  el.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h2>Filtrar por rango de fechas</h2><div class="desc">Filtra los embarques por ETD o ETA. Valor CIF, Costos, Arancel/IVA/Tributos Aduaneros se filtran por los BL de esos embarques; los Rubros BD Importaciones y facturas con pago pendiente se filtran por su propia fecha de factura.</div></div>
        <div class="toolbar">
          <select class="field" id="resumenDateField">
            <option value="fecha_arribo">ETA llegada</option>
            <option value="fecha_zarpe">ETD salida</option>
          </select>
          <input type="date" class="field" id="resumenDesde">
          <span style="color:var(--text-muted)">—</span>
          <input type="date" class="field" id="resumenHasta">
          <button class="btn" id="resumenClearFilter">Limpiar filtro</button>
          <span style="font-size:12px;color:var(--text-muted)" id="resumenFilterCount"></span>
        </div>
      </div>
    </div>
    <div id="resumenContent"></div>
  `;

  const dateFieldSel = document.getElementById('resumenDateField');
  const desdeInput = document.getElementById('resumenDesde');
  const hastaInput = document.getElementById('resumenHasta');
  dateFieldSel.value = resumenDateField;
  desdeInput.value = resumenDesde;
  hastaInput.value = resumenHasta;

  function paint(){
    const content = document.getElementById('resumenContent');
    const emb = STATE.embarques;
    const filterActive = !!(resumenDesde || resumenHasta);
    const embF = filterActive ? emb.filter(e => inDateRange(e[resumenDateField], resumenDesde, resumenHasta)) : emb;
    const blSetF = new Set(embF.map(e=>e.bl).filter(Boolean));
    const dmF = filterActive ? STATE.datosMercancia.filter(r=>blSetF.has(r.bl)) : STATE.datosMercancia;
    const cmF = filterActive ? STATE.costoMercancia.filter(r=>blSetF.has(r.bl)) : STATE.costoMercancia;
    const bdF = filterActive ? STATE.bdImportaciones.filter(r=>inDateRange(r.fecha, resumenDesde, resumenHasta)) : STATE.bdImportaciones;

    document.getElementById('resumenFilterCount').textContent = filterActive
      ? `${embF.length} de ${emb.length} embarques en el rango`
      : '';

    const activos = embF.filter(e => !['Entregado','Cerrado'].includes(e.estado_impo));
    const enTransito = embF.filter(e => e.estado_impo === 'En tránsito').length;
    const enPuerto = embF.filter(e => ['En puerto','Nacionalización'].includes(e.estado_impo)).length;
    const finalizados = embF.filter(e => ['Entregado','Cerrado'].includes(e.estado_impo)).length;
    const preEmbarque = embF.filter(e => ['Espera de reserva','Reserva confirmada','Emisión pendiente'].includes(e.estado_impo)).length;

    const alertas = embF
      .map(e => ({e, a: alertaLlegada(e.fecha_arribo)}))
      .filter(x => x.a.dias !== null && x.a.dias <= 10 && x.a.dias >= 0)
      .sort((a,b)=>a.a.dias-b.a.dias);

    const totalGranTotalBD = bdF.reduce((s,r)=>s+Number(r.gran_total||0),0);
    const totalCostoMercancia = cmF.reduce((s,r)=>s+Number(r.gran_total||0),0);
    const totalValorCIF = dmF.reduce((s,r)=>s+Number(r.valor_total_mercancia_cop||0),0);
    const pendientesPago = bdF.filter(r=>r.estado_pago==='Pendiente').length;
    const totalArancel = cmF.reduce((s,r)=>s+Number(r.arancel||0),0);
    const totalIvaImpo = cmF.reduce((s,r)=>s+Number(r.iva||0),0);
    const totalTributosAduaneros = totalArancel + totalIvaImpo;
    const nConTributos = cmF.filter(r=>Number(r.arancel||0) || Number(r.iva||0)).length;

    // Costo Total Logístico Impo, % LOG IMPO, y las dos variantes de Costo total importación
    // (a pedido de Juan Camilo, ya presentes como columnas en Liquidación Incoterm) se acumulan
    // aquí por BL con la misma fórmula que liquidacionTotales(), usando el universo de BL que
    // quedó dentro del filtro de fechas (dmF/cmF). "% LOG IMPO" acumulado se calcula como suma
    // de Costo Total Logístico Impo ÷ suma de Valor FOB (promedio ponderado por el tamaño de
    // cada importación) -- no como promedio simple de los porcentajes de cada BL, que le daría
    // el mismo peso a un BL pequeño que a uno grande y distorsionaría el indicador.
    const lqBlsResumen = new Set([...dmF.map(r=>r.bl), ...cmF.map(r=>r.bl)].filter(Boolean));
    let totalCostoLogisticoImpo = 0, totalValorFOBParaPct = 0, totalCostoImportacionConIVA = 0, totalCostoImportacionNetoSinIVA = 0;
    lqBlsResumen.forEach(bl=>{
      const t = liquidacionTotales(bl);
      totalCostoLogisticoImpo += t.costoTotalLogisticoImpo;
      totalValorFOBParaPct += t.valorFOB;
      totalCostoImportacionConIVA += t.totalImportacion;
      totalCostoImportacionNetoSinIVA += t.totalImportacionNeto;
    });
    const pctLogImpoAcumulado = totalValorFOBParaPct ? (totalCostoLogisticoImpo / totalValorFOBParaPct * 100) : null;

    content.innerHTML = `
    <div class="kpi-row">
      <div class="kpi"><span class="label">Embarques activos</span><span class="value">${activos.length}</span><span class="sub">de ${embF.length} ${filterActive?'en el rango':'totales'}</span></div>
      <div class="kpi accent-info"><span class="label">En tránsito</span><span class="value">${enTransito}</span><span class="sub">navegación internacional</span></div>
      <div class="kpi accent-warning"><span class="label">En puerto / nacionalización</span><span class="value">${enPuerto}</span><span class="sub">gestión local</span></div>
      <div class="kpi accent-success"><span class="label">Entregados / cerrados</span><span class="value">${finalizados}</span><span class="sub">${preEmbarque} en pre-embarque</span></div>
    </div>
    <div class="kpi-row">
      <div class="kpi"><span class="label">Valor CIF acumulado</span><span class="value mono" style="font-size:18px">${moneyCOP(totalValorCIF)}</span><span class="sub">${dmF.length} embarques con datos de mercancía</span></div>

      <div class="kpi"><span class="label">Costo total importación Neto (excluye IVA)</span><span class="value mono" style="font-size:18px">${moneyCOP(totalCostoImportacionNetoSinIVA)}</span><span class="sub">Total anterior menos el IVA de nacionalización</span></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div><h2>Alertas de llegada próximas (≤10 días)</h2><div class="desc">Calculado igual que la hoja "Control importaciones": días para llegada = ETA − hoy.</div></div>
      </div>
      <div class="panel-body flush">
        ${alertas.length ? `<div class="table-scroll"><table class="grid">
          <thead><tr><th>CI / Embarque</th><th>BL</th><th>Punto</th><th>ETA</th><th>Alerta</th><th>Estado</th></tr></thead>
          <tbody>
            ${alertas.map(({e,a})=>`
              <tr class="row-${ESTADO_COLOR[e.estado_impo]||'neutral'}">
                <td class="mono">${esc(e.ci||'')}</td>
                <td class="mono">${esc(e.bl||'')}</td>
                <td>${esc(e.tienda||'')}</td>
                <td>${fmtDate(e.fecha_arribo)}</td>
                <td><span class="badge ${a.cls}">${a.label}</span></td>
                <td><span class="badge ${ESTADO_COLOR[e.estado_impo]||'neutral'}">${esc(e.estado_impo||'—')}</span></td>
              </tr>`).join('')}
          </tbody>
        </table></div>` : `<div class="empty">No hay embarques con llegada dentro de los próximos 10 días.</div>`}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><div><h2>Distribución por estado</h2></div></div>
      <div class="panel-body">
        <div class="waterfall">
          ${['Espera de reserva','Reserva confirmada','Emisión pendiente','En tránsito','En puerto','Nacionalización','Entregado','Cerrado'].map(st=>{
            const n = embF.filter(e=>e.estado_impo===st).length;
            const pct = embF.length ? Math.round(n/embF.length*100) : 0;
            const cls = ESTADO_COLOR[st];
            return `<div class="wf-row">
              <span class="wf-label">${st}</span>
              <div class="wf-track"><div class="wf-fill" style="width:${pct}%; background:var(--${cls==='neutral'?'neutral-stage':cls})"></div></div>
              <span class="wf-value">${n} (${pct}%)</span>

      </div>
    </div>
  `;
  }

  dateFieldSel.addEventListener('change', e=>{ resumenDateField = e.target.value; paint(); });

<script>
/* ============================================================
   VISTA: SEGUIMIENTO DE EMBARQUES
   ============================================================ */
const EMB_FIELDS = [
  {k:'cuenta', label:'N° Importación', type:'seq', w:110},
  {k:'ci', label:'CI', type:'text', w:110, mono:true},
  {k:'bl', label:'N° BL / HBL', type:'text', w:150, mono:true},
  {k:'tienda', label:'Punto/Sucursal', type:'text', w:110},
  {k:'producto', label:'Producto', type:'text', w:140},
  {k:'origen', label:'Puerto carga', type:'text', w:110},
  {k:'destino', label:'Puerto descargue', type:'text', w:120},
  {k:'naviera', label:'Naviera', type:'text', w:130},
  {k:'fwd', label:'Agente / FWD', type:'text', w:110},
  {k:'tte_terrestre', label:'Tte terrestre', type:'text', w:110},
  {k:'tipo_contenedor', label:'Tipo cont.', type:'text', w:90},
  {k:'cantidad_contenedores', label:'Cantidad de Contenedores', type:'number', w:140},
  {k:'cont_no', label:'N° contenedor', type:'text', w:130, mono:true},
  {k:'fecha_zarpe', label:'ETD salida', type:'date', w:130},
  {k:'fecha_arribo', label:'ETA llegada', type:'date', w:130},
  {k:'dias_para_llegada', label:'Días para Llegada', type:'computed_days', w:120},
  {k:'dias_libres_bodega', label:'Días Libres en Bodega', type:'number', w:140},
  {k:'fecha_bodega_est', label:'Fecha bodega est.', type:'computed_date', w:140},
  {k:'fecha_bodega_real', label:'Fecha bodega real', type:'date', w:140},
  {k:'tiempo_adicional_bodega', label:'Tiempo Adicional en Bodega', type:'computed_days', w:160},
  {k:'incoterm', label:'Incoterm', type:'select', opts:INCOTERM_OPTS, w:90},
  {k:'estado_impo', label:'Estado', type:'select', opts:ESTADO_IMPO_OPTS, w:170},
  {k:'n_factura', label:'N° Factura', type:'text', w:110},
  {k:'di', label:'DI', type:'text', w:130, mono:true},
  {k:'puerto_zona_franca', label:'Puerto/Zona Franca', type:'text', w:120},
  {k:'observaciones', label:'Observaciones', type:'text', w:180},
];

/* Numera cada importación en orden ascendente por fecha de zarpe (ETD); estable e
   independiente del filtro/orden actual de la tabla. No se guarda en BD: es solo
   de presentación (la columna "cuenta" original se conserva intacta, y sigue
   visible sin cambios en la columna "CI", con la que siempre ha sido idéntica). */
function computeImportSequence(){
  const sorted = [...STATE.embarques].sort((a,b)=>{
    const da = a.fecha_zarpe, db = b.fecha_zarpe;
    if(da && db) return da < db ? -1 : (da > db ? 1 : 0);
    if(da && !db) return -1;
    if(!da && db) return 1;
    return String(a.created_at||a.id).localeCompare(String(b.created_at||b.id));
  });
  const map = {};
  sorted.forEach((r,i)=>{ map[r.id] = i+1; });
  return map;
}

let embFilter = {estado:'', tienda:'', q:''};

function embRowsFiltered(){
  return STATE.embarques.filter(r=>{
    if(embFilter.estado && r.estado_impo !== embFilter.estado) return false;
    if(embFilter.tienda && !(r.tienda||'').toUpperCase().includes(embFilter.tienda.toUpperCase())) return false;
    if(embFilter.q){
      const hay = (r.bl+' '+r.ci+' '+r.producto+' '+r.cont_no+' '+r.naviera).toUpperCase();
      if(!hay.includes(embFilter.q.toUpperCase())) return false;
    }
    return true;
  });
}

function cellInput(f, row, seqMap){
  if(f.type==='seq'){
    const n = seqMap ? seqMap[row.id] : null;
    return `<span class="mono" style="color:var(--text-muted)" title="Consecutivo ascendente por fecha ETD">${n!=null?n:'—'}</span>`;
  }
  if(f.type==='computed_days'){
    const v = row[f.k];
    return `<span class="mono" style="color:var(--text-muted)" title="Calculado automáticamente">${v==null?'—':v+' d'}</span>`;
  }
  if(f.type==='computed_date'){
    const v = row[f.k];
    return `<span class="mono" style="color:var(--text-muted)" title="Calculado: ETA llegada + Días Libres en Bodega">${v?fmtDate(v):'—'}</span>`;
  }
  const val = row[f.k] ?? '';
  if(f.type==='select'){
    return `<select class="cell" data-field="${f.k}">
      <option value="">—</option>
      ${f.opts.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}
    </select>`;
  }
  const type = f.type==='date' ? 'date' : (f.type==='number' ? 'number' : 'text');
  return `<input class="cell${f.mono?' mono':''}" type="${type}" data-field="${f.k}" value="${esc(val)}">`;
}

function renderEmbarquesTable(){
  const rows = embRowsFiltered();
  const seqMap = computeImportSequence();
  const thead = `<tr>${EMB_FIELDS.map(f=>`<th style="min-width:${f.w}px">${f.label}</th>`).join('')}<th style="min-width:90px">Alerta</th><th style="min-width:50px"></th></tr>`;
  const tbody = rows.map(row=>{
    const cls = ESTADO_COLOR[row.estado_impo] || '';
    const a = alertaLlegada(row.fecha_arribo);
    return `<tr data-id="${row.id}" class="${cls?'row-'+cls:''}">
      ${EMB_FIELDS.map(f=>`<td>${cellInput(f,row,seqMap)}</td>`).join('')}
      <td><span class="badge ${a.cls}">${a.label}</span></td>
      <td><button class="btn small danger" data-action="del-emb" data-id="${row.id}" title="Eliminar">✕</button></td>
    </tr>`;
  }).join('');
  return `<div class="table-scroll"><table class="grid"><thead>${thead}</thead><tbody>${tbody || `<tr><td colspan="${EMB_FIELDS.length+2}"><div class="empty">Sin embarques que coincidan con el filtro.</div></td></tr>`}</tbody></table></div>`;
}

VIEWS.embarques = function(){
  const el = document.getElementById('view-embarques');
  el.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h2>Seguimiento de Embarques</h2><div class="desc">Adaptado de "Seguimiento_Embarque" y "Control importaciones" · colores por estado: <span class="badge success">verde = finalizado</span> <span class="badge warning">amarillo = en puerto</span> <span class="badge info">azul = en tránsito</span> <span class="badge neutral">gris = pre-embarque</span></div></div>
        <div class="toolbar">
          <button class="btn primary" id="embAddRow">+ Nuevo embarque</button>
          <button class="btn" id="embImportBtn">Importar Excel</button>
          <input type="file" id="embImportFile" accept=".xlsx,.xls" style="display:none">
          <button class="btn" id="embExportBtn">Exportar Excel</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="filters">
          <select class="field" id="embFEstado"><option value="">Todos los estados</option>${ESTADO_IMPO_OPTS.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>
          <input class="field" id="embFTienda" placeholder="Filtrar por punto/sucursal…">
          <input class="field" id="embFQ" placeholder="Buscar BL, contenedor, producto, naviera…" style="min-width:240px">
          <span style="font-size:12px;color:var(--text-muted)" id="embCount"></span>
        </div>
      </div>
      <div class="panel-body flush" id="embTableWrap"></div>
    </div>
  `;

  const wrap = document.getElementById('embTableWrap');
  function paint(){
    wrap.innerHTML = renderEmbarquesTable();
    document.getElementById('embCount').textContent = embRowsFiltered().length + ' de ' + STATE.embarques.length + ' embarques';
  }
  paint();

  document.getElementById('embFEstado').addEventListener('change', e=>{embFilter.estado=e.target.value; paint();});
  document.getElementById('embFTienda').addEventListener('input', debounce(e=>{embFilter.tienda=e.target.value; paint();},200));
  document.getElementById('embFQ').addEventListener('input', debounce(e=>{embFilter.q=e.target.value; paint();},200));

  document.getElementById('embAddRow').addEventListener('click', async ()=>{
    const row = await DB.insert('impo_embarques', {estado_impo:'Espera de reserva'});
    if(row){ STATE.embarques.unshift(row); paint(); toast('Embarque creado','ok'); }
  });

  wrap.addEventListener('change', async (e)=>{
    const t = e.target;
    if(!t.dataset.field) return;
    const tr = t.closest('tr');
    const id = tr.dataset.id;
    const field = t.dataset.field;
    const fdef = EMB_FIELDS.find(f=>f.k===field);
    let value = t.value === '' ? null : t.value;
    if(fdef && fdef.type==='number' && value!==null) value = Number(value);
    const patch = {[field]: value};
    const updated = await DB.update('impo_embarques', id, patch);
    if(updated){
      const idx = STATE.embarques.findIndex(r=>r.id===id);
      if(idx>-1) STATE.embarques[idx] = updated;
      // Estos campos afectan al color/alerta de la fila, al consecutivo "N° Importación"
      // y/o a las columnas calculadas (Días para Llegada, Fecha bodega est., Tiempo
      // adicional en bodega), así que se repinta toda la tabla para reflejarlas.
      const needsFullRepaint = ['estado_impo','fecha_arribo','fecha_zarpe','dias_libres_bodega','fecha_bodega_real'].includes(field);
      if(needsFullRepaint) paint();
    }
  });

  wrap.addEventListener('click', async (e)=>{
    const btn = e.target.closest('[data-action="del-emb"]');
    if(!btn) return;
    if(!confirm('¿Eliminar este embarque? Esta acción no se puede deshacer.')) return;
    const ok = await DB.remove('impo_embarques', btn.dataset.id);
    if(ok){
      STATE.embarques = STATE.embarques.filter(r=>r.id!==btn.dataset.id);
      paint();
      toast('Embarque eliminado','ok');
    }
  });

  document.getElementById('embExportBtn').addEventListener('click', exportEmbarquesExcel);
  document.getElementById('embImportBtn').addEventListener('click', ()=>document.getElementById('embImportFile').click());
  document.getElementById('embImportFile').addEventListener('change', importEmbarquesExcel);
};

function exportEmbarquesExcel(){
  const seqMap = computeImportSequence();
  const rows = STATE.embarques.map(r=>{
    const a = alertaLlegada(r.fecha_arribo);
    return {
      'N° IMPORTACIÓN': seqMap[r.id] ?? '', 'CI': r.ci, 'N° HBL': r.bl, 'SUCURSAL': r.tienda, 'PRODUCTO': r.producto,
      'ESTADO': r.estado_impo, 'INCOTERM': r.incoterm,
      'PROVEEDOR/EMBARCADOR': r.proveedor_embarcador, 'PUERTO DE CARGA': r.origen, 'PUERTO DE DESCARGUE': r.destino,
      'NAVIERA': r.naviera, 'AGENTE/FWD': r.fwd, 'TTE TERRESTRE': r.tte_terrestre,
      'TIPO CONTENEDOR': r.tipo_contenedor, 'CANTIDAD DE CONTENEDORES': r.cantidad_contenedores, 'N° CONTENEDOR': r.cont_no,
      "ETD - SALIDA": r.fecha_zarpe, "ETA - LLEGADA": r.fecha_arribo,
      'DÍAS PARA LLEGADA (TRÁNSITO ETD-ETA)': r.dias_para_llegada,
      'DÍAS LIBRES EN BODEGA': r.dias_libres_bodega,
      'FECHA BODEGA EST (CALCULADA)': r.fecha_bodega_est, 'FECHA BODEGA REAL': r.fecha_bodega_real,
      'TIEMPO ADICIONAL EN BODEGA': r.tiempo_adicional_bodega,
      'ALERTA - DÍAS RESTANTES PARA ETA': a.dias, 'ALERTA DE LLEGADA': a.label,
      'N° FACTURA': r.n_factura, 'DI': r.di, 'PUERTO/ZONA FRANCA': r.puerto_zona_franca,
      'OBSERVACIONES': r.observaciones,
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Seguimiento embarques');
  XLSX.writeFile(wb, `Seguimiento_Embarques_${todayISO()}.xlsx`);
  toast('Excel exportado','ok');
}

async function importEmbarquesExcel(e){
  const file = e.target.files[0];
  if(!file) return;
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const sheetName = wb.SheetNames.find(n=>/seguimiento/i.test(n)) || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const json = XLSX.utils.sheet_to_json(ws, {defval:null});
  if(!json.length){ toast('No se encontraron filas en la hoja seleccionada','err'); return; }

  const norm = (o) => {
    const g = (...keys) => { for(const k of keys){ for(const kk of Object.keys(o)){ if(kk.toLowerCase().replace(/\s+/g,'').includes(k)) return o[kk]; } } return null; };
    const toISO = (v) => {
      if(!v) return null;
      if(v instanceof Date) return v.toISOString().slice(0,10);
      const d = new Date(v); return isNaN(d) ? null : d.toISOString().slice(0,10);
    };
    const toNum = (v) => { if(v===null || v===undefined || v==='') return null; const n = Number(v); return isNaN(n) ? null : n; };
    return {
      ci: g('ci','cuenta'),
      cuenta: g('cuenta','ci'),
      tienda: g('tienda','sucursal','punto'),
      producto: g('producto'),
      origen: g('origen','puertocarga','puertodeorigen'),
      destino: g('destino','puertodescargue','puertodedestino'),
      bl: g('bl','hbl','nhbl'),
      tipo_contenedor: g('tipocontenedor','tipocont'),
      cantidad_contenedores: toNum(g('cantidaddecontenedores','cantidadcontenedores','numerodecontenedores')),
      cont_no: g('contno','contenedor','ncontenedor'),
      fwd: g('fwd','agente'),
      naviera: g('naviera'),
      tte_terrestre: g('ttette','tteterrestre','transporteterrestre'),
      fecha_zarpe: toISO(g('fechadezarpe','etdsalida','etd')),
      fecha_arribo: toISO(g('fechadearribo','etallegada','eta')),
      dias_libres_bodega: toNum(g('diaslibresenbodega','diaslibresbodega')),
      fecha_bodega_real: toISO(g('fechaenbodegareal','fechabodegareal')),
      di: g('di'),
      puerto_zona_franca: g('puertozonafranca','puertpuertozonafrancao'),
      estado_impo: (()=>{ const s=(g('status','estado')||'').toString().toUpperCase();
        if(s.includes('FINAL')) return 'Entregado';
        if(s.includes('PUERTO')) return 'En puerto';
        if(s.includes('TRANSITO')||s.includes('TRÁNSITO')) return 'En tránsito';
        if(ESTADO_IMPO_OPTS.includes(g('status','estado'))) return g('status','estado');
        return null;
      })(),
    };
  };

  let created=0, matched=0;
  for(const raw of json){
    const rec = norm(raw);
    if(!rec.bl && !rec.ci) continue;
    const existing = STATE.embarques.find(e => (rec.bl && e.bl===rec.bl) || (rec.ci && e.ci===rec.ci));
    if(existing){
      const updated = await DB.update('impo_embarques', existing.id, rec);
      if(updated){ Object.assign(existing, updated); matched++; }
    } else {
      const row = await DB.insert('impo_embarques', rec);
      if(row){ STATE.embarques.push(row); created++; }
    }
  }
  toast(`Importación completa: ${created} creados, ${matched} actualizados`, 'ok');
  VIEWS.embarques();
  e.target.value = '';
}
</script>

<script>

   VISTA: CONTROL FINANCIERO (BD IMPORTACIONES)
   ============================================================ */
let bdFilter = {bl:'', estadoPago:'', estadoImpo:''};

function bdRowsFiltered(){
  return STATE.bdImportaciones.filter(r=>{
    if(bdFilter.bl && !(r.bl||'').toUpperCase().includes(bdFilter.bl.toUpperCase())) return false;
    if(bdFilter.estadoPago && r.estado_pago !== bdFilter.estadoPago) return false;
    if(bdFilter.estadoImpo && r.estado_impo !== bdFilter.estadoImpo) return false;

function proveedorDatalist(){
  return `<datalist id="dlProveedores">${STATE.proveedores.map(p=>`<option value="${esc(p.proveedor)}">`).join('')}</datalist>`;
}

const BD_FIELDS_LEFT = [

  {k:'bl', label:'BL / Embarque', type:'bl', w:150},
  {k:'n_factura', label:'N° Factura', type:'text', w:120},

const BD_FIELDS_MONEY = [

// Nota: Arancel, Sanciones, Costo Logística-Cta Impo y Gtos COFA ya NO se capturan aquí (a
// pedido de Juan Camilo, por ser información redundante con el cruce automático hacia
// Liquidación Incoterm) — para que un rubro de servicio sume a uno de esos conceptos, se
// etiqueta con "Rubro Costo_Mercancia" (ver bdCruceInputs más abajo) en vez de escribir un
// monto aparte en una columna que no se conecta con Liquidación Incoterm. Las columnas
// arancel/sanciones/costo_logistica/gtos_cofa/total_a_pagar/gran_total siguen existiendo en
// la base de datos (no se borraron, por si hay datos históricos), simplemente ya no se
// muestran ni se editan desde este grid.
const BD_FIELDS_MONEY_RETEN = [
  {k:'rte_fte', label:'ReteFuente'},
  {k:'reteiva', label:'ReteIVA'},
];
const BD_FIELDS_RIGHT = [
  {k:'estado_pago', label:'Estado de Pago', type:'select', opts:ESTADO_PAGO_OPTS, w:130},
  {k:'estado_impo', label:'Estado Impo', type:'select', opts:ESTADO_IMPO_OPTS, w:170},
];

// "Tipo de factura" y "Rubro Costo_Mercancia" son las dos columnas que alimentan el cruce
// automático hacia Liquidación Incoterm (ver computeAutoRubros/recomputeLiquidacionFromControlFinanciero
// más abajo). Se renderizan aparte de cellInput() porque sus opciones son pares {value,label},
// no strings simples como el resto de los selects de este grid.
// Nota: las facturas de tipo "Mercancía" (FOB/Flete/Seguro/TRM) solo se cargan completas desde
// "Importar Facturas" — este grid de Control Financiero está pensado para rubros de servicio y
// no tiene columnas de FOB/Flete/Seguro en USD.
function bdCruceInputs(row){
  const tipo = row.tipo_factura || 'servicio';
  const tipoSel = `<select class="cell" data-field="tipo_factura">${TIPO_FACTURA_OPTS.map(o=>`<option value="${o.value}" ${tipo===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
  const rubroSel = `<select class="cell" data-field="rubro_costo_mercancia" ${tipo==='mercancia'?'disabled title="No aplica: esta factura es de mercancía, no de servicio"':''}>
    <option value="">— sin asignar —</option>
    ${RUBRO_COSTO_MERCANCIA_OPTS.map(o=>`<option value="${o.value}" ${o.value===row.rubro_costo_mercancia?'selected':''}>${esc(o.label)}</option>`).join('')}
  </select>`;
  return {tipoSel, rubroSel};
}

function bdCellInput(f, row){
  const val = row[f.k] ?? '';
  if(f.type==='select') return cellInput(f,row);
  if(f.type==='bl'){
    return `<input class="cell mono" list="dlBLs" data-field="bl" value="${esc(val)}" placeholder="N° BL">`;
  }
  if(f.type==='proveedor'){
    return `<input class="cell" list="dlProveedores" data-field="proveedor" value="${esc(val)}" placeholder="Proveedor…">`;
  }
  return `<input class="cell${f.mono?' mono':''}" type="text" data-field="${f.k}" value="${esc(val)}">`;
}
function moneyCellInput(k, row){
  return `<input class="cell mono" type="number" step="0.01" data-field="${k}" value="${row[k] ?? 0}" style="text-align:right">`;
}

function renderBdTable(){
  const rows = bdRowsFiltered();
  const thead = `<tr>
    ${BD_FIELDS_LEFT.map(f=>`<th style="min-width:${f.w}px">${f.label}</th>`).join('')}
    ${BD_FIELDS_MONEY.map(f=>`<th style="min-width:110px">${f.label}</th>`).join('')}
    <th style="min-width:130px">Total Operación</th>
    ${BD_FIELDS_MONEY_RETEN.map(f=>`<th style="min-width:110px">${f.label}</th>`).join('')}
    <th style="min-width:150px">Total menos Retenciones</th>
    ${BD_FIELDS_RIGHT.map(f=>`<th style="min-width:${f.w}px">${f.label}</th>`).join('')}
    <th style="min-width:200px">Tipo de factura</th>
    <th style="min-width:220px">Rubro Costo_Mercancia</th>
    <th style="min-width:50px"></th>
  </tr>`;
  const tbody = rows.map(row=>{
    const cruce = bdCruceInputs(row);
    return `
    <tr data-id="${row.id}">
      ${BD_FIELDS_LEFT.map(f=>`<td>${bdCellInput(f,row)}</td>`).join('')}
      ${BD_FIELDS_MONEY.map(f=>`<td>${moneyCellInput(f.k,row)}</td>`).join('')}
      <td class="mono" style="text-align:right;font-weight:600">${moneyCOP(row.total_operacion)}</td>
      ${BD_FIELDS_MONEY_RETEN.map(f=>`<td>${moneyCellInput(f.k,row)}</td>`).join('')}
      <td class="mono" style="text-align:right;font-weight:700;color:var(--accent)">${moneyCOP(row.total_menos_retenciones)}</td>
      ${BD_FIELDS_RIGHT.map(f=>`<td>${cellInput(f,row)}</td>`).join('')}
      <td>${cruce.tipoSel}</td>
      <td>${cruce.rubroSel}</td>
      <td><button class="btn small danger" data-action="del-bd" data-id="${row.id}">✕</button></td>
    </tr>`;}).join('');
  return `<div class="table-scroll"><table class="grid"><thead>${thead}</thead><tbody>${tbody || `<tr><td colspan="18"><div class="empty">Sin rubros registrados. Usa "+ Nuevo rubro" o importa facturas PDF.</div></td></tr>`}</tbody></table></div>`;
}

<script>
/* ============================================================
   VISTA: LIQUIDACIÓN INCOTERM
   Combina impo_datos_mercancia (FOB→CIF) + impo_costo_mercancia
   (nacionalización, logística, entrega) para dar el costo total
   de importación puesto en bodega, clasificado por etapa Incoterm.
   ============================================================ */
let incotermSelectedBL = null;
let lqCurrency = 'COP'; // moneda de visualización de la Liquidación Incoterm: COP o USD (según TRM del BL)

function allLiquidacionBLs(){
  const set = new Set();
  STATE.datosMercancia.forEach(r=>r.bl && set.add(r.bl));
  STATE.costoMercancia.forEach(r=>r.bl && set.add(r.bl));
  return Array.from(set);
}

// Motor del cruce automático Control Financiero -> Liquidación Incoterm (a pedido de Juan
// Camilo). Agrupa las facturas/rubros de BD Importaciones de un BL en dos totales: lo que
// corresponde a Datos_Mercancia (facturas de mercancía) y, por rubro, lo que corresponde a
// Costo_Mercancia (facturas de servicio con un rubro asignado). Una factura de servicio sin
// rubro asignado se ignora aquí — sigue viéndose en Control Financiero, pero no se suma a
// ningún lado de la Liquidación Incoterm hasta que se le asigne un rubro.
// Para las facturas de servicio se suma "total_menos_retenciones" (el neto de esa factura
// después de descuento/IVA/retenciones) — deliberadamente NO las columnas heredadas de
// Arancel/Sanciones/Costo logística/Gtos COFA que ya existen por fila en BD Importaciones,
// que siguen siendo un cálculo aparte para el panel "Liquidación por BL" de Control
// Financiero. Mezclar ambas sumaría el mismo costo dos veces.
function computeAutoRubros(bl){
  const rows = STATE.bdImportaciones.filter(r=>r.bl===bl);
  const mercancia = {fob:0, freight:0, insurance:0, count:0, facturas:[]};
  const servicio = {}; // rubro -> {sum, count, facturas:[]}
  rows.forEach(r=>{
    if(r.tipo_factura==='mercancia'){
      mercancia.fob += Number(r.fob_usd||0);
      mercancia.freight += Number(r.flete_usd||0);
      mercancia.insurance += Number(r.seguro_usd||0);
      mercancia.count++;
      mercancia.facturas.push(r);
    } else if(r.tipo_factura==='servicio' && r.rubro_costo_mercancia){
      const key = r.rubro_costo_mercancia;
      if(!servicio[key]) servicio[key] = {sum:0, count:0, facturas:[]};
      const monto = Number(r.total_menos_retenciones ?? r.subtotal ?? 0);
      servicio[key].sum += monto;
      servicio[key].count++;
      servicio[key].facturas.push(r);
    }
  });
  return {mercancia, servicio};
}

// Recalcula y guarda (upsert) en impo_datos_mercancia / impo_costo_mercancia los campos que
// tienen al menos una factura tageada en Control Financiero para este BL. Es un recálculo
// completo (no un incremento), así que es seguro llamarlo después de crear, editar o
// eliminar cualquier factura/rubro — siempre deja el campo en la suma vigente de las
// facturas tageadas en ese momento. Un campo sin ninguna factura tageada para este BL NO se
// toca (para no pisar un valor cargado a mano antes de tener facturas, p. ej. una
// estimación mientras llega la factura real).
async function recomputeLiquidacionFromControlFinanciero(bl){
  if(!bl) return;
  const auto = computeAutoRubros(bl);
  const emb = STATE.embarques.find(e=>e.bl===bl);

  if(auto.mercancia.count > 0){
    let dm = STATE.datosMercancia.find(r=>r.bl===bl);
    const patch = {fob: auto.mercancia.fob, freight: auto.mercancia.freight, insurance: auto.mercancia.insurance};
    // Si el BL todavía no tiene TRM propia cargada, se toma la de la última factura de
    // mercancía que sí traiga una — sin pisar una TRM que Juan Camilo ya haya cargado a mano.
    if(!dm || !Number(dm.trm)){
      const conTrm = auto.mercancia.facturas.filter(f=>Number(f.trm_factura)>0);
      if(conTrm.length) patch.trm = Number(conTrm[conTrm.length-1].trm_factura);
    }
    if(!dm){
      dm = await DB.insert('impo_datos_mercancia', {bl, embarque_id: emb?emb.id:null, producto: emb?emb.producto:null, punto: emb?emb.tienda:null, ...patch});
      if(dm) STATE.datosMercancia.push(dm);
    } else {
      const updated = await DB.update('impo_datos_mercancia', dm.id, patch);
      if(updated) Object.assign(dm, updated);
    }
  }

  const rubroKeys = Object.keys(auto.servicio);
  if(rubroKeys.length){
    let cm = STATE.costoMercancia.find(r=>r.bl===bl);
    const patch = {};
    rubroKeys.forEach(k=>{ patch[k] = auto.servicio[k].sum; });
    if(!cm){
      cm = await DB.insert('impo_costo_mercancia', {bl, embarque_id: emb?emb.id:null, producto: emb?emb.producto:null, punto: emb?emb.tienda:null, ...patch});
      if(cm) STATE.costoMercancia.push(cm);
    } else {
      const updated = await DB.update('impo_costo_mercancia', cm.id, patch);
      if(updated) Object.assign(cm, updated);
    }
  }
}

function liquidacionTotales(bl){
  const dm = STATE.datosMercancia.find(r=>r.bl===bl);
  const cm = STATE.costoMercancia.find(r=>r.bl===bl);
  const valorCIF = dm ? Number(dm.valor_total_mercancia_cop||0) : 0;
  const valorFOB = dm ? Number(dm.valor_mci_cop||0) : 0;
  const fleteSeguro = dm ? Number(dm.flete_seguro_cop||0) : 0;
  const arancel = cm ? Number(cm.arancel||0) : 0;
  const iva = cm ? Number(cm.iva||0) : 0;
  const tributosAduaneros = arancel + iva;
  const puertoAlmReconocimiento = cm ? Number(cm.puerto_alm_reconocimiento||0) : 0;
  const serviciosJas = cm ? Number(cm.servicios_jas||0) : 0;
  const fleteTerrestre = cm ? Number(cm.flete_terrestre||0) : 0;
  const gtosBancarios4x1000 = cm ? Number(cm.gtos_bancarios_4x1000||0) : 0;
  const costoLogisticaCtaImpo = cm ? Number(cm.costo_logistica_cta_impo||0) : 0;
  const gtosCofa = cm ? Number(cm.gtos_cofa||0) : 0;
  const granTotalCosto = cm ? Number(cm.gran_total||0) : 0;
  const totalImportacion = valorCIF + granTotalCosto;
  // "Costo total importación" (gran_total) ya incluye el IVA de nacionalización (cm.iva) sumado
  // dentro de sí mismo -- ver generation_expression de impo_costo_mercancia.gran_total. El "Neto"
  // resta ese IVA para mostrar el costo sin ese componente, a pedido de Juan Camilo.
  const totalImportacionNeto = totalImportacion - iva;
  // "Costo Total Logístico Impo" (a pedido de Juan Camilo): solo la parte logística/operativa
  // del proceso -- Flete+Seguro, Puerto/Alm./Reconocimiento, Servicios agente (JAS), Flete
  // Terrestre, Costo Logística-Cta Impo y Gtos COFA -- sin incluir Arancel, IVA, Sanciones,
  // 4x1000/Gtos bancarios ni IVA ASLO (esos son tributos/costos financieros, no logísticos).
  // "% LOG IMPO" es ese costo logístico como porcentaje del Valor FOB de la mercancía; ambos
  // son independientes de la moneda seleccionada (son la misma proporción en COP o en USD).
  const costoTotalLogisticoImpo = fleteSeguro + puertoAlmReconocimiento + serviciosJas + fleteTerrestre + costoLogisticaCtaImpo + gtosCofa;
  const pctLogImpo = valorFOB ? (costoTotalLogisticoImpo / valorFOB * 100) : null;
  return {dm, cm, valorFOB, fleteSeguro, valorCIF, arancel, iva, tributosAduaneros, puertoAlmReconocimiento, serviciosJas, fleteTerrestre, gtosBancarios4x1000, costoLogisticaCtaImpo, gtosCofa, costoTotalLogisticoImpo, pctLogImpo, granTotalCosto, totalImportacion, totalImportacionNeto};
}

/* ============================================================
   Columnas configurables (mostrar/ocultar + ancho ajustable) de la
   tabla de Liquidación Incoterm — a pedido de Juan Camilo. La
   selección de columnas visibles y el ancho de cada una se guardan
   en localStorage (por navegador/dispositivo, no en Supabase, porque
   es una preferencia de visualización de quien está usando la app
   en ese momento, no un dato del negocio) para no tener que volver
   a configurarlas cada vez. "BL" y el botón "Ver / editar" son fijos
   (no se pueden ocultar) porque sin ellos la tabla deja de ser útil.
   ============================================================ */
const LQ_COL_PREFS_KEY = 'bitacora_impo_lq_columnas_v1';
function loadLqColPrefs(){
  try{
    const raw = localStorage.getItem(LQ_COL_PREFS_KEY);
    if(!raw) return {hidden:[], widths:{}};
    const parsed = JSON.parse(raw);
    return {
      hidden: Array.isArray(parsed.hidden) ? parsed.hidden : [],
      widths: (parsed.widths && typeof parsed.widths==='object') ? parsed.widths : {},
    };
  }catch(e){ return {hidden:[], widths:{}}; }
}
function saveLqColPrefs(){
  try{ localStorage.setItem(LQ_COL_PREFS_KEY, JSON.stringify(lqColPrefs)); }
  catch(e){ /* almacenamiento no disponible (modo privado, cuota llena, etc.) -- no es crítico, se ignora */ }
}
let lqColPrefs = loadLqColPrefs();

function lqColumnDefs(){
  return [
    {key:'bl', label:'BL', locked:true, width:150, mono:true, render:(c)=>esc(c.bl)},
    {key:'producto', label:'Producto', width:150, render:(c)=>esc((c.t.dm&&c.t.dm.producto)||(c.emb&&c.emb.producto)||'')},
    {key:'punto', label:'Punto', width:120, render:(c)=>esc((c.t.dm&&c.t.dm.punto)||(c.emb&&c.emb.tienda)||'')},
    {key:'trm', label:'TRM', width:100, align:'right', mono:true, render:(c)=>c.trm?money(c.trm,2):'—'},
    {key:'valorFOB', label:'Valor FOB', suf:true, width:150, align:'right', mono:true, render:(c)=>moneyDual(c.t.valorFOB, c.trm, c.currency)},
    {key:'fleteSeguro', label:'Flete+Seguro', suf:true, width:150, align:'right', mono:true, render:(c)=>moneyDual(c.t.fleteSeguro, c.trm, c.currency)},
    {key:'valorCIF', label:'Valor CIF', suf:true, width:150, align:'right', mono:true, bold:true, render:(c)=>moneyDual(c.t.valorCIF, c.trm, c.currency)},
    {key:'arancel', label:'Arancel', suf:true, width:140, align:'right', mono:true, render:(c)=>moneyDual(c.t.arancel, c.trm, c.currency)},
    {key:'iva', label:'IVA', suf:true, width:130, align:'right', mono:true, render:(c)=>moneyDual(c.t.iva, c.trm, c.currency)},
    {key:'tributosAduaneros', label:'Tributos Aduaneros', suf:true, width:170, align:'right', mono:true, bold:true, render:(c)=>moneyDual(c.t.tributosAduaneros, c.trm, c.currency)},
    {key:'puertoAlmReconocimiento', label:'Puerto / Alm. / Reconocimiento', suf:true, width:190, align:'right', mono:true, render:(c)=>moneyDual(c.t.puertoAlmReconocimiento, c.trm, c.currency)},

function renderLiquidacionTable(currency){
  currency = currency || 'COP';
  const bls = allLiquidacionBLs();
  if(!bls.length) return `<div class="empty">No hay datos de mercancía / costo cargados todavía.</div>`;
  const suf = currency==='USD' ? ' (USD, según TRM del BL)' : ' (COP)';
  const cols = lqColumnDefs().filter(c => c.locked || !lqColPrefs.hidden.includes(c.key));
  const colgroupHtml = cols.map(c=>{
    const w = Number(lqColPrefs.widths[c.key]) || c.width;
    return `<col data-colkey="${c.key}" style="width:${w}px">`;
  }).join('');
  const theadHtml = cols.map(c=>{
    const label = `${c.label}${c.suf?suf:''}${c.sufSuffix||''}`;
    return `<th>${esc(label)}<span class="col-resize-handle" data-colkey="${c.key}" title="Arrastrar para ajustar el ancho"></span></th>`;
  }).join('');
  const rows = bls.map(bl=>{
    const t = liquidacionTotales(bl);
    const emb = STATE.embarques.find(e=>e.bl===bl);
    const trm = getTrmForBl(bl);
    const ctx = {t, trm, currency, bl, emb};
    const tds = cols.map(c=>{
      const styleParts = [];
      if(c.align==='right') styleParts.push('text-align:right');
      if(c.bold) styleParts.push('font-weight:700');
      if(c.accent) styleParts.push('color:var(--accent)');
      const cls = c.mono ? ' class="mono"' : '';
      const style = styleParts.length ? ` style="${styleParts.join(';')}"` : '';
      return `<td${cls}${style}>${c.render(ctx)}</td>`;
    }).join('');
    return `<tr data-bl="${esc(bl)}" style="cursor:pointer">${tds}</tr>`;
  }).join('');
  return `<div class="table-scroll"><table class="grid lq-resizable" id="lqTable">
    <colgroup>${colgroupHtml}</colgroup>
    <thead><tr>${theadHtml}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function openLqColumnsModal(onChange){
  const cols = lqColumnDefs().filter(c=>!c.locked);
  const itemsHtml = cols.map(c=>`
    <label style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;cursor:pointer">
      <input type="checkbox" data-colkey="${c.key}" ${lqColPrefs.hidden.includes(c.key)?'':'checked'}>
      ${esc(c.label)}
    </label>`).join('');
  openModal(`
    <h3>Columnas visibles — Liquidación Incoterm</h3>
    <p class="helptext" style="margin-top:-4px">Elige qué columnas mostrar en la tabla. "BL" y el botón "Ver / editar" siempre quedan visibles. Esta selección, y el ancho de cada columna (arrastrando el borde derecho de su encabezado), se guardan en este navegador para que no tengas que volver a configurarlos cada vez. La exportación a Excel siempre incluye todas las columnas, se muestren o no aquí.</p>
    <div id="lqColCheckboxes" style="max-height:340px;overflow:auto;margin:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:0 16px">${itemsHtml}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button class="btn" id="lqColShowAll">Mostrar todas</button>
      <button class="btn" id="lqColResetWidths">Restablecer anchos</button>
      <button class="btn primary" id="lqColClose">Listo</button>
    </div>
  `);
  document.getElementById('lqColCheckboxes').querySelectorAll('input[type="checkbox"]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const key = cb.dataset.colkey;
      lqColPrefs.hidden = lqColPrefs.hidden.filter(k=>k!==key);
      if(!cb.checked) lqColPrefs.hidden.push(key);
      saveLqColPrefs();
      onChange();
    });
  });
  document.getElementById('lqColShowAll').addEventListener('click', ()=>{
    lqColPrefs.hidden = [];
    saveLqColPrefs();
    onChange();
    openLqColumnsModal(onChange);
  });
  document.getElementById('lqColResetWidths').addEventListener('click', ()=>{
    lqColPrefs.widths = {};
    saveLqColPrefs();
    onChange();
  });
  document.getElementById('lqColClose').addEventListener('click', closeModal);
}

function wireLqColumnResize(){
  const wrap = document.getElementById('lqTableWrap');
  if(!wrap) return;
  wrap.querySelectorAll('.col-resize-handle').forEach(handle=>{
    handle.addEventListener('mousedown', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const key = handle.dataset.colkey;
      const table = wrap.querySelector('#lqTable');
      const col = table ? table.querySelector(`colgroup col[data-colkey="${key}"]`) : null;
      if(!col) return;
      const startX = e.clientX;
      const startWidth = col.getBoundingClientRect().width;
      const minWidth = 60;
      function onMove(ev){
        const newWidth = Math.max(minWidth, Math.round(startWidth + (ev.clientX - startX)));
        col.style.width = newWidth + 'px';
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        lqColPrefs.widths[key] = parseInt(col.style.width, 10);
        saveLqColPrefs();
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

function moneyFieldRow(label, key, obj, table, autoCount){
  const val = obj ? (obj[key] ?? 0) : 0;
  if(autoCount){
    return `<div>
      <div class="grid2" style="align-items:center">
        <label class="field-label" style="margin:0">${label}</label>
        <input class="field mono" type="number" step="0.01" value="${val}" style="text-align:right;background:var(--bg-soft,#f3f4f6);color:var(--muted,#666)" disabled title="Se calcula automáticamente sumando las facturas de Control Financiero etiquetadas a este rubro para este BL.">
      </div>
      <div class="helptext" style="text-align:right;margin-top:2px">🔗 automático desde Control Financiero (${autoCount} factura${autoCount>1?'s':''})</div>
    </div>`;
  }
  return `<div class="grid2" style="align-items:center">
    <label class="field-label" style="margin:0">${label}</label>
    <input class="field mono" type="number" step="0.01" data-lqtable="${table}" data-field="${key}" value="${val}" style="text-align:right">
  </div>`;
}

        'PUERTO/ALM/RECONOCIMIENTO': t.cm?t.cm.puerto_alm_reconocimiento:0, 'FLETE TERRESTRE': t.cm?t.cm.flete_terrestre:0,
        '4X1000/GTOS BANCARIOS': t.cm?t.cm.gtos_bancarios_4x1000:0, 'IVA ASLO': t.cm?t.cm.iva_aslo:0,
        'COSTO LOGISTICA': t.cm?t.cm.costo_logistica_cta_impo:0, 'GTOS COFA': t.cm?t.cm.gtos_cofa:0,
        'COSTO TOTAL LOGISTICO IMPO': t.costoTotalLogisticoImpo,
        '% LOG IMPO': t.pctLogImpo===null ? '' : Number(t.pctLogImpo.toFixed(2)),
        'GRAN TOTAL COSTOS COP': t.granTotalCosto,
        'COSTO TOTAL IMPORTACION COP (INCLUYE IVA)': t.totalImportacion,
        'COSTO TOTAL IMPORTACION USD (INCLUYE IVA)': trm ? Number((t.totalImportacion/trm).toFixed(2)) : '',
        'COSTO TOTAL IMPORTACION NETO COP (EXCLUYE IVA)': t.totalImportacionNeto,
        'COSTO TOTAL IMPORTACION NETO USD (EXCLUYE IVA)': trm ? Number((t.totalImportacionNeto/trm).toFixed(2)) : '',
      };
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Liquidación Incoterm');
    XLSX.writeFile(wb, `Liquidacion_Incoterm_${todayISO()}.xlsx`);
    toast('Excel exportado','ok');
  });

  paint();
};
</script>
