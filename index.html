<script>
/* ============================================================
   VISTA: IMPORTAR FACTURAS PDF
   Extracción de texto (pdf.js) + heurísticas de proveedor / NIT /
   N° factura / monto / BL. SIEMPRE se presenta como borrador para
   revisión manual antes de guardar — no hay garantía de 100% de
   precisión porque cada proveedor factura en formato distinto.
   ============================================================ */
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

let facturaSelectedId = null;
let pendingInvoices = []; // {file, text, guess, id}
let pendingSeq = 0;

// Reconstruye el orden de lectura VISUAL (fila por fila, de arriba hacia abajo y de izquierda
// a derecha) usando la posición (x,y) de cada fragmento de texto — en vez del orden en que el
// PDF los dibujó internamente. Muchas facturas colombianas arman sus tablas dibujando primero
// toda una columna de etiquetas y luego, mucho más adelante en el archivo, la columna de
// valores; extraídos en ese orden crudo, una etiqueta como "SUBTOTAL" podía terminar a cientos
// de caracteres de su monto real. Agrupando por fila según la coordenada Y (con un margen de
// tolerancia) y ordenando cada fila por X, "SUBTOTAL" y su valor vuelven a quedar en la misma
// línea, tal como se ven en el PDF.
function reconstructReadingOrder(items){
  const rows = [];
  for(const it of items){
    if(!it.str || !it.str.trim()) continue;
    const y = it.transform[5];
    const x = it.transform[4];
    let row = rows.find(r => Math.abs(r.y - y) < (it.height||8)*0.6);
    if(!row){ row = {y, items:[]}; rows.push(row); }
    row.items.push({x, str: it.str});
  }
  rows.sort((a,b)=> b.y - a.y); // Y del PDF crece hacia arriba: orden descendente = arriba→abajo
  // Además del texto de cada fila (para las búsquedas "etiqueta ... valor en la misma línea"
  // que ya existían), se guarda un charMap: para cada posición de caracter del texto de la
  // fila, la X del fragmento original de donde vino. Esto permite luego, en tablas donde la
  // fila de etiquetas y la fila de valores están físicamente separadas (columnas), ubicar en
  // qué X cayó una etiqueta y buscar el valor de la fila de abajo que quede en esa misma
  // columna — ver extractFromColumnTable.
  rows.forEach(r => {
    r.items.sort((a,b)=>a.x-b.x);
    let text = '';
    const charMap = [];
    r.items.forEach((it, idx) => {
      if(idx>0){ text += ' '; charMap.push(null); }
      for(let k=0;k<it.str.length;k++) charMap.push(it.x);
      text += it.str;
    });
    r.text = text;
    r.charMap = charMap;
  });
  return rows;
}

async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let text = '';
  const rows = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const pageRows = reconstructReadingOrder(content.items);
    rows.push(...pageRows);
    text += pageRows.map(r=>r.text).join('\n') + '\n';
  }
  return {text, rows};
}

function parseMoneyToken(tok){
  tok = (tok==null?'':String(tok)).replace(/[^\d.,]/g,'');
  if(!tok) return null;
  // El separador decimal es el ÚLTIMO punto o coma del texto, y solo cuenta como decimal si
  // le siguen 1 o 2 dígitos hasta el final (formato de centavos: "7.445,47", "7,445.47",
  // "111.04"). Si le siguen 3 dígitos se trata como separador de miles, no decimal — así se
  // interpretan bien tanto el formato colombiano sin decimales ("736.843" = 736.843 pesos,
  // "3.878.120" = 3.878.120 pesos) como el formato anglo con centavos ("21,940,471.69").
  const decMatch = tok.match(/[.,](\d{1,2})$/);
  let intPart, decPart;
  if(decMatch){
    intPart = tok.slice(0, tok.length - decMatch[0].length);
    decPart = decMatch[1];
  } else {
    intPart = tok;
    decPart = '';
  }
  intPart = intPart.replace(/[.,]/g, '');
  if(!intPart && !decPart) return null;
  const n = parseFloat((intPart||'0') + (decPart ? '.'+decPart : ''));
  return isNaN(n) ? null : n;
}

// Respaldo para tablas donde la fila de ETIQUETAS de columna (p.ej. "SUBTOTAL IVA
// RETEFUENTE TOTAL A PAGAR") y la fila de VALORES están físicamente separadas — no una
// junto a la otra en la misma línea, sino en dos filas visuales distintas, alineadas por
// columna (X). Esto pasa en el resumen de totales de las facturas de TKS (y puede pasar en
// otras plantillas parecidas), y reconstructReadingOrder por sí solo no lo resuelve porque
// ahí no hay ninguna línea que combine etiqueta+valor.
// Busca la etiqueta, y si la encuentra, mira SOLO en la fila inmediatamente siguiente (nunca
// más abajo, para no terminar agarrando por error un número de cuenta bancaria u otro dato
// no relacionado) el valor cuya columna (X) esté más cerca de la X de la etiqueta.
function extractFromColumnTable(rows, labelSource, refNumbers, {skipIfPrecededBy}={}){
  const labelRe = new RegExp(labelSource, 'i');
  for(let ri=0; ri<rows.length; ri++){
    const row = rows[ri];
    const m = row.text.match(labelRe);
    if(!m) continue;
    if(skipIfPrecededBy){
      const before = row.text.slice(Math.max(0, m.index-12), m.index).toUpperCase();
      if(before.includes(skipIfPrecededBy)) continue;
    }
    let labelX = null;
    for(let i=m.index; i<m.index+m[0].length; i++){ if(row.charMap[i]!=null){ labelX = row.charMap[i]; break; } }
    if(labelX == null) continue;
    const valRow = rows[ri+1];
    if(!valRow) continue;
    // Candidatos con "forma de monto": empiezan con "$", o traen separador de miles cada 3
    // dígitos (p.ej. "11,091,498") — esto excluye columnas de cantidad ("5", "5.00") y
    // cualquier número sin ese formato (como un número de referencia largo sin separadores).
    const numRe = /\$?\s?[\d][\d.,]{0,17}=?/g;
    let nm, candidates = [];
    while((nm = numRe.exec(valRow.text)) !== null){
      const raw = nm[0];
      const looksLikeMoney = /\$/.test(raw) || /^\d{1,3}([.,]\d{3})+([.,]\d{1,2})?=?$/.test(raw.trim());
      if(!looksLikeMoney) continue;
      const val = parseMoneyToken(raw);
      if(val === null || val < 0) continue;
      if(refNumbers && refNumbers.has(val)) continue;
      let x = null;
      for(let i=nm.index; i<nm.index+raw.length; i++){ if(valRow.charMap[i]!=null){ x = valRow.charMap[i]; break; } }
      if(x == null) continue;
      candidates.push({val, x});
    }
    if(!candidates.length) continue;
    candidates.sort((a,b)=> Math.abs(a.x-labelX) - Math.abs(b.x-labelX));
    return candidates[0].val;
  }
  return null;
}

function guessInvoiceFields(text, rows, fileName){
  const upper = text.toUpperCase();
  fileName = fileName || '';

  // Proveedor: coincidencia contra la tabla de proveedores conocidos
  let proveedor = null, provRec = null;
  for(const p of STATE.proveedores){
    if(upper.includes(p.proveedor.toUpperCase())){ proveedor = p.proveedor; provRec = p; break; }
  }

  // NIT — se prioriza el NIT ya conocido del proveedor (más confiable que el regex,
  // que puede confundir el NIT del comprador/consignatario con el del proveedor)
  let nitRegex = null;
  const nitMatch = text.match(/NIT[.:\s]{0,4}([0-9][0-9.\-]{5,17})/i);
  if(nitMatch) nitRegex = nitMatch[1].trim();
  let nit = (provRec && provRec.nit) || nitRegex || null;

  // N° Factura — primero en el texto, luego en el nombre del archivo (suele traer pistas: "Factura JAS BOG88606")
  let nFactura = null;
  const facturaPatterns = [
    /FACT[-\s]?([0-9]{3,10})/i,
    /FACTURA\s*(?:ELECTR[OÓ]NICA)?\s*N[°ºo.:]{0,3}\s*([A-Z]{0,4}-?[0-9]{3,10})/i,
    /INVOICE\s*(?:NO|N[°ºo.:])?\s*[:.]?\s*([A-Z0-9\-]{4,15})/i,
  ];
  for(const re of facturaPatterns){ const m = text.match(re); if(m){ nFactura = m[1]; break; } }
  if(!nFactura){
    const fnMatch = fileName.match(/FACTURA[\s_-]*([A-Z]{0,4}\s?[0-9]{3,12})/i) || fileName.match(/FACT[\s_-]*([A-Z]{0,4}[0-9]{3,12})/i);
    if(fnMatch) nFactura = fnMatch[1].trim();
  }

  // BL — coincidencia exacta contra los BL conocidos del sistema
  let bl = null;
  for(const e of STATE.embarques){
    if(e.bl && upper.includes(e.bl.toUpperCase())){ bl = e.bl; break; }
  }
  if(!bl){
    const hblMatch = text.match(/H\/?BL[:\s]{0,4}([A-Z0-9]{8,20})/i);
    if(hblMatch) bl = hblMatch[1];
  }

  // Rubros de la factura: Subtotal, Descuento, IVA, Total operación, RETEFUENTE, RETEIVA, Total final.
  // Se busca "<etiqueta> ... <número>" y se descarta cualquier candidato que coincida con algún
  // número de referencia (N° de factura detectado, o cualquier número visible en el nombre del
  // archivo: estos suelen traer más de un número de referencia, p.ej. "Factura 21606 Nc804.pdf"
  // trae tanto 21606 como 804 — ninguno de los dos es un monto).
  const nFacturaNum = nFactura ? parseMoneyToken(nFactura) : null;
  const refNumbers = new Set();
  if(nFacturaNum != null) refNumbers.add(nFacturaNum);
  (fileName.match(/\d{3,10}/g) || []).forEach(d => refNumbers.add(Number(d)));
  function extractLabeled(labelSource, {skipIfPrecededBy}={}){
    // Se busca la etiqueta y luego se revisan TODOS los números que aparecen en lo que resta
    // de esa misma línea (el texto ya viene reordenado visualmente por reconstructReadingOrder,
    // así que la línea sí corresponde a una fila real de la factura). Si una fila trae más de
    // un monto — por ejemplo una factura con columna en USD y columna en Pesos — se usa el
    // ÚLTIMO válido, que en las facturas colombianas casi siempre es la columna en pesos. Se
    // descarta cualquier número seguido de "%" (una tasa, no un monto) y cualquier número que
    // coincida con un número de referencia (factura, etc.) en vez de adivinar otro valor.
    const labelRe = new RegExp(labelSource, 'gi');
    let m;
    while((m = labelRe.exec(text)) !== null){
      if(skipIfPrecededBy){
        const before = text.slice(Math.max(0, m.index-12), m.index).toUpperCase();
        if(before.includes(skipIfPrecededBy)) continue;
      }
      const nlIdx = text.indexOf('\n', labelRe.lastIndex);
      const restOfLine = text.slice(labelRe.lastIndex, nlIdx===-1 ? text.length : nlIdx);
      // {0,17} (no {2,17}) para no perder valores legítimos de 1-2 dígitos como "DESCUENTO 0"
      // o "RETEIVA 0" — al buscar solo dentro de la línea de la etiqueta, aceptar números
      // cortos aquí es seguro.
      const numRe = /([\d][\d.,]{0,17})\s{0,2}(%)?/g;
      let nm, lastVal = null;
      while((nm = numRe.exec(restOfLine)) !== null){
        if(nm[2]) continue; // es una tasa (%), no un monto
        const val = parseMoneyToken(nm[1]);
        if(val === null) continue;
        if(refNumbers.has(val)) continue; // evita confundir con un número de referencia (factura, etc.)
        if(val < 0) continue; // un monto negativo no tiene sentido aquí, pero 0 sí es válido (p.ej. "DESCUENTO 0")
        lastVal = val;
      }
      if(lastVal !== null) return lastVal;
    }
    return null;
  }

  // Si la búsqueda "etiqueta ... valor en la misma línea" no encuentra nada, se intenta el
  // respaldo de tabla por columnas (extractFromColumnTable), para las facturas donde la fila
  // de etiquetas y la fila de valores están físicamente separadas (ver comentario de esa función).
  const subtotal = extractLabeled('SUB[\\s.\\-]{0,3}TOTAL') ?? extractFromColumnTable(rows, 'SUB[\\s.\\-]{0,3}TOTAL', refNumbers);
  const descuento = extractLabeled('DESCUENTOS?') ?? extractFromColumnTable(rows, 'DESCUENTOS?', refNumbers);
  const iva = extractLabeled('\\bI\\.?\\s*V\\.?\\s*A\\.?\\b', {skipIfPrecededBy:'RETE'}) ?? extractFromColumnTable(rows, '\\bI\\.?\\s*V\\.?\\s*A\\.?\\b', refNumbers, {skipIfPrecededBy:'RETE'});
  const totalOperacion = extractLabeled('TOTAL\\s*(?:DE\\s*LA\\s*)?OPERACI[OÓ]N') ?? extractFromColumnTable(rows, 'TOTAL\\s*(?:DE\\s*LA\\s*)?OPERACI[OÓ]N', refNumbers);
  const retefuente = extractLabeled('RETE\\s*\\.?\\s*FUENTE') ?? extractLabeled('RETENCI[OÓ]N\\s*EN\\s*LA\\s*FUENTE')
    ?? extractFromColumnTable(rows, 'RETE\\s*\\.?\\s*FUENTE', refNumbers) ?? extractFromColumnTable(rows, 'RETENCI[OÓ]N\\s*EN\\s*LA\\s*FUENTE', refNumbers);
  const reteiva = extractLabeled('RETE\\s*\\.?\\s*I\\.?\\s*V\\.?\\s*A\\.?') ?? extractLabeled('RETENCI[OÓ]N\\s*DE\\s*I\\.?\\s*V\\.?\\s*A\\.?')
    ?? extractFromColumnTable(rows, 'RETE\\s*\\.?\\s*I\\.?\\s*V\\.?\\s*A\\.?', refNumbers) ?? extractFromColumnTable(rows, 'RETENCI[OÓ]N\\s*DE\\s*I\\.?\\s*V\\.?\\s*A\\.?', refNumbers);
  const totalFinal = extractLabeled('TOTAL\\s*MENOS\\s*RETENCIONES') ?? extractLabeled('NETO\\s*A\\s*PAGAR')
    ?? extractLabeled('TOTAL\\s*A\\s*PAGAR') ?? extractLabeled('VALOR\\s*TOTAL') ?? extractLabeled('GRAN\\s*TOTAL')
    ?? extractLabeled('\\bTOTAL\\b', {skipIfPrecededBy:'SUB'})
    ?? extractFromColumnTable(rows, 'TOTAL\\s*MENOS\\s*RETENCIONES', refNumbers) ?? extractFromColumnTable(rows, 'NETO\\s*A\\s*PAGAR', refNumbers)
    ?? extractFromColumnTable(rows, 'TOTAL\\s*A\\s*PAGAR', refNumbers) ?? extractFromColumnTable(rows, 'VALOR\\s*TOTAL', refNumbers) ?? extractFromColumnTable(rows, 'GRAN\\s*TOTAL', refNumbers)
    ?? extractFromColumnTable(rows, '\\bTOTAL\\b', refNumbers, {skipIfPrecededBy:'SUB'});

  // Moneda
  const moneda = /USD|US\$|DOLLARS?/i.test(text) && !/COP|PESOS COLOMBIANOS/i.test(text) ? 'USD' : 'COP';

  // Fecha (dd/mm/aaaa o dd-mm-aaaa)
  let fecha = null;
  const fechaMatch = text.match(/\b([0-3]?\d)[\/\-]([01]?\d)[\/\-](20\d{2})\b/);
  if(fechaMatch){
    const [_, d, mo, y] = fechaMatch;
    fecha = `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }

  // Si no se detectó subtotal pero sí un total final, se usa el total final como mejor estimación del subtotal
  // (queda igual de editable; es solo un punto de partida razonable).
  const subtotalFinal = subtotal ?? (totalOperacion==null && retefuente==null && reteiva==null ? totalFinal : null);

  // Tipo de factura y rubro de Costo_Mercancia: se proponen a partir de la configuración del
  // proveedor (Proveedores y Conceptos) — el usuario siempre puede corregirlos en la tarjeta.
  const tipoFactura = provRec ? (provRec.tipo_factura_default || 'servicio') : 'servicio';
  const rubroCostoMercancia = (provRec && tipoFactura==='servicio') ? (provRec.rubro_costo_mercancia || null) : null;

  // FOB / Flete / Seguro (solo relevantes si es una factura de mercancía): intento best-effort,
  // reutilizando la misma búsqueda de etiquetas. En la práctica esta combinación rara vez viene
  // clara y separada en el PDF (a diferencia de Subtotal/IVA en las facturas de servicio), así
  // que estos tres casi siempre quedarán en blanco y hay que digitarlos a mano — no se debe
  // confiar en esta extracción para Datos_Mercancia sin revisar contra la factura real.
  const fobGuess = extractLabeled('\\bFOB\\b') ?? extractFromColumnTable(rows, '\\bFOB\\b', refNumbers);
  const fleteGuess = extractLabeled('FLETE\\s*INTERNACIONAL') ?? extractLabeled('\\bFREIGHT\\b')
    ?? extractFromColumnTable(rows, 'FLETE\\s*INTERNACIONAL', refNumbers) ?? extractFromColumnTable(rows, '\\bFREIGHT\\b', refNumbers);
  const seguroGuess = extractLabeled('\\bSEGURO\\b') ?? extractLabeled('\\bINSURANCE\\b')
    ?? extractFromColumnTable(rows, '\\bSEGURO\\b', refNumbers) ?? extractFromColumnTable(rows, '\\bINSURANCE\\b', refNumbers);

  return {
    proveedor, nit, concepto: provRec?provRec.concepto:null,
    etapa_incoterm: provRec?provRec.etapa_incoterm:null, n_factura: nFactura, bl, moneda, fecha,
    subtotal: subtotalFinal, descuento, iva, total_operacion: totalOperacion,
    retefuente, reteiva, total_final: totalFinal,
    tipo_factura: tipoFactura, rubro_costo_mercancia: rubroCostoMercancia,
    fob_usd: fobGuess, flete_usd: fleteGuess, seguro_usd: seguroGuess, trm_factura: null,
    confianza: (proveedor?1:0)+(nFactura?1:0)+(totalFinal||subtotalFinal?1:0)+(bl?1:0),
  };
}

async function handlePdfFiles(fileList){
  const files = Array.from(fileList).filter(f=>f.type==='application/pdf' || /\.pdf$/i.test(f.name));
  if(!files.length){ toast('No se encontraron archivos PDF','err'); return; }
  toast(`Procesando ${files.length} PDF(s)…`);
  for(const file of files){
    try{
      const {text, rows} = await extractPdfText(file);
      const guess = guessInvoiceFields(text, rows, file.name);
      pendingInvoices.push({id:'pi'+(pendingSeq++), file, text, guess});
    }catch(err){
      console.error(err);
      toast('No se pudo leer '+file.name+': '+err.message, 'err');
    }
  }
  renderPendingInvoices();
}

async function saveInvoiceCard(pid){
  const card = document.querySelector(`.invoice-card[data-pid="${pid}"]`);
  const inv = pendingInvoices.find(i=>i.id===pid);
  if(!card || !inv) return;
  const val = sel => card.querySelector(sel).value;
  const proveedor = val('.pv-proveedor');
  const nit = val('.pv-nit');
  const n_factura = val('.pv-factura');
  const fecha = val('.pv-fecha');
  const bl = val('.pv-bl');
  const tipo_factura = val('.pv-tipo-factura') || 'servicio';
  const emb = STATE.embarques.find(e=>e.bl===bl);

  // bdPatch: columnas específicas de impo_bd_importaciones según el tipo de factura.
  // finalCandidatos: lo que se guarda en impo_facturas.campos_candidatos para la ficha de
  // detalle — a diferencia de antes, se toman los valores YA EDITADOS en la tarjeta (no el
  // "guess" original sin revisar), para que la ficha de detalle refleje lo que realmente se
  // guardó.
  let bdPatch, monto, concepto = null, etapa_incoterm = null, finalCandidatos;

  if(tipo_factura === 'mercancia'){
    const moneda = val('.pv-moneda') || 'USD';
    const fob_usd = Number(val('.pv-fob'))||0;
    const flete_usd = Number(val('.pv-flete'))||0;
    const seguro_usd = Number(val('.pv-seguro'))||0;
    const trm_factura = Number(val('.pv-trm'))||null;
    // Monto de referencia (impo_facturas.monto_detectado) en la moneda de la factura de
    // mercancía — normalmente USD, a diferencia de las facturas de servicio que son en COP.
    monto = fob_usd + flete_usd + seguro_usd;
    bdPatch = {
      tipo_factura, rubro_costo_mercancia: null, moneda, fob_usd, flete_usd, seguro_usd, trm_factura,
      subtotal: 0, descuento: 0, iva: 0, rte_fte: 0, reteiva: 0,
    };
    finalCandidatos = {
      proveedor, nit, n_factura, bl, fecha, moneda, tipo_factura,
      fob_usd, flete_usd, seguro_usd, trm_factura,
      confianza: inv.guess.confianza,
    };
  } else {
    concepto = val('.pv-concepto');
    etapa_incoterm = val('.pv-etapa');
    const rubro_costo_mercancia = val('.pv-rubro') || null;
    const subtotal = Number(val('.pv-subtotal'))||0;
    const descuento = Number(val('.pv-descuento'))||0;
    const iva = Number(val('.pv-iva'))||0;
    const total_operacion = Number(val('.pv-totalop'))||0;
    const rte_fte = Number(val('.pv-retefuente'))||0;
    const reteiva = Number(val('.pv-reteiva'))||0;
    const totalFinalCard = Number(val('.pv-totalfinal'))||0;
    // Monto de referencia para impo_facturas: preferimos el total ya neto de
    // retenciones si la factura lo trae explícito; si no, lo calculamos con
    // la misma fórmula que usa la BD (subtotal - descuento + iva - retenciones).
    const totalOperacionCalc = subtotal - descuento + iva;
    const totalMenosRetCalc = totalOperacionCalc - rte_fte - reteiva;
    monto = totalFinalCard || totalMenosRetCalc || subtotal;
    bdPatch = {tipo_factura, rubro_costo_mercancia, moneda:'COP', subtotal, descuento, iva, rte_fte, reteiva};
    finalCandidatos = {
      proveedor, nit, n_factura, bl, fecha, concepto, etapa_incoterm, moneda:'COP', tipo_factura, rubro_costo_mercancia,
      subtotal, descuento, iva, total_operacion, retefuente: rte_fte, reteiva, total_final: totalFinalCard,
      confianza: inv.guess.confianza,
    };
  }

  // 1. Subir el PDF original a Storage
  let storage_path = null;
  try{
    const path = `${Date.now()}_${inv.file.name}`.replace(/[^a-zA-Z0-9._\-]/g,'_');
    const {error: upErr} = await sb.storage.from(BUCKET).upload(path, inv.file, {contentType:'application/pdf'});
    if(!upErr) storage_path = path;
  }catch(err){ console.warn('No se pudo subir el PDF a storage', err); }

  // 2. Registrar en impo_facturas
  const factura = await DB.insert('impo_facturas', {
    file_name: inv.file.name, storage_path, bl_detectado: bl, proveedor_detectado: proveedor,
    nit_detectado: nit, n_factura_detectado: n_factura, monto_detectado: monto, concepto_detectado: concepto,
    texto_extraido: inv.text.slice(0, 20000), campos_candidatos: finalCandidatos,
    embarque_id: emb?emb.id:null, estado_revision: 'confirmada',
  });
  if(factura) STATE.facturas.push(factura);

  // 3. Crear el rubro en BD Importaciones
  // Nota: total_operacion, total_menos_retenciones, total_a_pagar y gran_total
  // son columnas calculadas automáticamente en la base de datos a partir de
  // subtotal/descuento/iva/rte_fte/reteiva (y arancel/sanciones/costos
  // logísticos que se ajustan luego en Control Financiero) — no se envían aquí.
  const bdRow = await DB.insert('impo_bd_importaciones', {
    fecha, bl, producto: emb?emb.producto:null, punto: emb?emb.tienda:null, nit, proveedor, n_factura,
    concepto, etapa_incoterm, estado_pago: 'Pendiente', estado_impo: emb?emb.estado_impo:null,
    embarque_id: emb?emb.id:null, factura_id: factura?factura.id:null,
    ...bdPatch,
  });
  if(bdRow) STATE.bdImportaciones.unshift(bdRow);

  if(factura && bdRow){
    await DB.update('impo_facturas', factura.id, {bd_importacion_id: bdRow.id});
  }

  // 4. Cruce automático hacia Liquidación Incoterm: si esta factura trae BL, Tipo de factura
  // y (para servicio) Rubro Costo_Mercancia, se suma sola a Datos_Mercancia/Costo_Mercancia.
  if(bl) await recomputeLiquidacionFromControlFinanciero(bl);

  pendingInvoices = pendingInvoices.filter(i=>i.id!==pid);
  renderPendingInvoices();
  renderConfirmedInvoices();
  toast('Factura guardada en BD Importaciones','ok');
}

  ['dragleave','drop'].forEach(evt=>drop.addEventListener(evt, e=>{ e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', e=>handlePdfFiles(e.dataTransfer.files));

  document.getElementById('pdfPendingWrap').addEventListener('click', (e)=>{
    const saveBtn = e.target.closest('[data-action="guardar-pdf"]');
    const delBtn = e.target.closest('[data-action="descartar-pdf"]');
    if(saveBtn) saveInvoiceCard(saveBtn.dataset.pid);
    if(delBtn){ pendingInvoices = pendingInvoices.filter(i=>i.id!==delBtn.dataset.pid); renderPendingInvoices(); }
  });

  document.getElementById('pdfPendingWrap').addEventListener('change', (e)=>{
    const sel = e.target.closest('.pv-tipo-factura');
    if(!sel) return;
    const card = sel.closest('.invoice-card');
    if(!card) return;
    const isMercancia = sel.value === 'mercancia';
    const servicioFields = card.querySelector('.pv-servicio-fields');
    const mercanciaFields = card.querySelector('.pv-mercancia-fields');
    if(servicioFields) servicioFields.style.display = isMercancia ? 'none' : 'block';
    if(mercanciaFields) mercanciaFields.style.display = isMercancia ? 'block' : 'none';
  });

  function paintFacturaDetail({scrollToDetail}={}){
    const dw = document.getElementById('facturaDetailWrap');
    if(!dw) return;
    dw.innerHTML = facturaSelectedId ? renderFacturaDetail(facturaSelectedId) : '';
    const closeBtn = document.getElementById('facturaClose');
    if(closeBtn) closeBtn.addEventListener('click', ()=>{ facturaSelectedId = null; paintFacturaDetail(); renderConfirmedInvoices(); });
    const pdfBtn = document.getElementById('facturaVerPdf');
    if(pdfBtn) pdfBtn.addEventListener('click', async ()=>{
      const f = STATE.facturas.find(r=>r.id===facturaSelectedId);
      if(!f || !f.storage_path) return;
      pdfBtn.disabled = true;
      try{
        const {data, error} = await sb.storage.from(BUCKET).createSignedUrl(f.storage_path, 60);
        if(error || !data) throw error || new Error('sin URL');
        window.open(data.signedUrl, '_blank');
      }catch(err){
        console.error(err);
        toast('No se pudo abrir el PDF original (¿sigue existiendo en Storage?)', 'err');
      } finally {
        pdfBtn.disabled = false;
      }
    });
    if(scrollToDetail){ dw.scrollIntoView({behavior:'smooth', block:'start'}); }
  }

  document.getElementById('pdfConfirmedWrap').addEventListener('click', (e)=>{
    const verBtn = e.target.closest('[data-action="ver-factura"]');
    if(!verBtn) return;

    facturaSelectedId = (facturaSelectedId===fid) ? null : fid;
    renderConfirmedInvoices();
    paintFacturaDetail({scrollToDetail: !!facturaSelectedId});
  });

  renderPendingInvoices();
  renderConfirmedInvoices();
  paintFacturaDetail();
};

<script>
/* ============================================================
   VISTA: LECTURA DI — a pedido de Juan Camilo: leer y tabular
   Declaraciones de Importación (DIAN/MUISCA), guardar un historial y
   poder exportarlo a Excel y CSV. Acepta tanto fotos/escaneos (OCR en
   el navegador con Tesseract.js) como PDF digital con texto
   seleccionable (reutiliza extractPdfText, igual que Importar
   Facturas). SIEMPRE se presenta como borrador editable antes de
   guardar — ni el OCR de una foto ni la extracción de un PDF son
   perfectos, y este formato de la DIAN trae letra muy pequeña y
   apretada.
   ============================================================ */
let pendingLecturaDi = null; // {file, tipoOrigen, texto, radicacion, subpartida, pagina_actual, pagina_total, n_factura, fecha_factura, bl, items:[{ref,producto,cantidad}], confianza} | null
let diSelectedId = null;

async function extractImageTextOcr(file, onProgress){
  if(!window.Tesseract) throw new Error('OCR no disponible (no se pudo cargar Tesseract.js)');
  const worker = await Tesseract.createWorker('spa', 1, {
    logger: (m) => { if(onProgress && m && m.status && m.progress!=null) onProgress(m.status, m.progress); }
  });
  try{
    const {data} = await worker.recognize(file);
    return data.text || '';
  } finally {
    try{ await worker.terminate(); }catch(e){}
  }
}

// Normaliza una fecha que puede venir como texto en varios formatos ("2026/08/08",
// "08/08/2026") o como objeto Date de JS (celdas de fecha de un Excel leído con
// SheetJS y cellDates:true) al formato ISO yyyy-mm-dd que usa el resto de la app.
// Compartida entre el parser de texto (OCR/PDF) y el parser de Excel.
function normalizeFechaToken(v){
  if(v==null || v==='') return null;
  if(v instanceof Date){
    if(isNaN(v)) return null;
    const y = v.getFullYear(), m = String(v.getMonth()+1).padStart(2,'0'), d = String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const s = String(v).trim();
  const iso = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(iso) return `${iso[1]}-${iso[2].padStart(2,'0')}-${iso[3].padStart(2,'0')}`;
  const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(dmy) return `${dmy[3]}-${dmy[2].padStart(2,'0')}-${dmy[1].padStart(2,'0')}`;
  return null;
}

// Extrae Radicación, Subpartida, Página, N° Factura, Fecha y la lista de ítems
// (REF / producto / cantidad) de un texto de Declaración de Importación ya
// extraído (por OCR de una foto o por lectura de un PDF digital). Es
// heurístico, apoyado en los patrones vistos en el formulario de la
// DIAN/MUISCA ("Radicación : NNNN", "Subpartida : NNNN", "Página X de Y",
// "REF.<código> <descripción> CANT. <número>" repetido muchas veces separado
// por "///", y "Factura No. <n° > Fecha <fecha>") — SIEMPRE debe revisarse a
// mano antes de guardar, sobre todo los ítems.
function parseDeclaracionImportacion(text){
  const flat = String(text||'').replace(/\s+/g, ' ').trim();
  function grab(re){ const m = flat.match(re); return m ? m[1].trim() : null; }

  const radicacion = grab(/RADICACI[OÓ]N\s*[:.]?\s*([0-9]{4,15})/i);
  const subpartida = grab(/SUBPARTIDA\s*[:.]?\s*([0-9]{6,12})/i);
  const paginaActual = grab(/P[AÁ]GINA\s*([0-9]{1,3})\s*DE\s*[0-9]{1,3}/i);
  const paginaTotal = grab(/P[AÁ]GINA\s*[0-9]{1,3}\s*DE\s*([0-9]{1,3})/i);
  const n_factura = grab(/FACTURA\s*N[o°º]?\.?\s*([A-Z0-9\-]{4,20})/i);
  const fechaRaw = grab(/FECHA\s*([0-9]{4}[\/\-][0-9]{1,2}[\/\-][0-9]{1,2}|[0-9]{1,2}[\/\-][0-9]{1,2}[\/\-][0-9]{4})/i);
  const fecha_factura = normalizeFechaToken(fechaRaw);

  // Ítems: se busca "REF.<código> <descripción> CANT. <número>" directamente con una expresión
  // regular global sobre el texto ya "aplanado" (sin saltos de línea) — no hace falta separar
  // primero por "///" u otros caracteres, porque exec() con la bandera global salta sola
  // cualquier texto entre un ítem y el siguiente. El ".*?" no-goloso hace que la descripción se
  // corte justo antes de "CANT", incluso cuando el OCR o el PDF los pegó sin espacio
  // ("NAVIDEÑOCANT. 600").
  const items = [];
  const itemRe = /REF\.?\s*([A-Z0-9]+(?:[.\-][A-Z0-9]+)*)\s*(.*?)\s*CANT\.?\s*[:.]?\s*([0-9]{1,7})\b/gi;
  let m;
  while((m = itemRe.exec(flat)) !== null){
    const producto = m[2].replace(/\/+$/,'').replace(/\s+/g,' ').trim();
    items.push({ref: m[1].trim(), producto, cantidad: Number(m[3])});
  }

  // Confianza: 1 punto por cada uno de los 4 campos de encabezado detectados, más 1 si se
  // detectó al menos un ítem (0 a 5) — igual de heurística que el indicador de Importar Facturas.
  const confianza = [radicacion, subpartida, n_factura, fecha_factura].filter(Boolean).length + (items.length ? 1 : 0);

  return {radicacion, subpartida, pagina_actual: paginaActual?Number(paginaActual):null, pagina_total: paginaTotal?Number(paginaTotal):null, n_factura, fecha_factura, items, confianza};
}

// Busca en las filas (array de arrays, tal como las entrega
// XLSX.utils.sheet_to_json(ws, {header:1}) ) una fila cuya primera celda coincida con
// labelRe (p.ej. "Radicación", "Subpartida") y devuelve el valor de la primera celda no
// vacía que le sigue en esa misma fila. Así se lee el bloque de encabezado tipo
// "etiqueta / valor" que suele preceder a la tabla de ítems en estas transcripciones.
function findHeaderValue(rows, labelRe){
  for(const row of rows){
    if(!row || !row.length) continue;
    const first = row[0];
    if(first==null) continue;
    if(labelRe.test(String(first).trim())){
      for(let i=1;i<row.length;i++){
        if(row[i]!=null && String(row[i]).trim()!==''){ return row[i]; }
      }
    }
  }
  return null;
}

// Extrae Radicación, Subpartida, N° Factura, Fecha e ítems (REF/producto/cantidad) de una
// hoja de Excel ya leída como array de arrays (una fila = un array de celdas). A diferencia
// de la importación masiva de embarques (que asume una fila de encabezado limpia en la
// primera línea), aquí se tolera un bloque de "etiqueta: valor" antes de la tabla de ítems
// (como en la transcripción real: Radicación/Subpartida/Factura No./Fecha factura en las
// primeras filas), seguido de una fila de encabezado de tabla (con columnas del estilo
// REF/Referencia, PRODUCTO/Descripción, CANT/Cantidad en cualquier orden) y luego las filas
// de ítems. Se descarta cualquier fila cuyo producto/descripción contenga "TOTAL" (fila de
// totales al pie de la tabla, no es un ítem real) y cualquier fila sin una cantidad numérica
// (filas en blanco, notas o la leyenda al final del archivo).
function parseExcelRows(rows){
  rows = (rows||[]).filter(r => Array.isArray(r));
  const radicacion = findHeaderValue(rows, /RADICACI[OÓ]N/i);
  const subpartida = findHeaderValue(rows, /SUBPARTIDA/i);
  const n_factura = findHeaderValue(rows, /FACTURA/i);
  const fecha_factura = normalizeFechaToken(findHeaderValue(rows, /FECHA/i));
  const paginaRaw = findHeaderValue(rows, /P[AÁ]GINA/i);
  let pagina_actual = null, pagina_total = null;
  if(paginaRaw!=null){
    const m = String(paginaRaw).match(/([0-9]{1,3})\s*(?:DE|\/)\s*([0-9]{1,3})/i);
    if(m){ pagina_actual = Number(m[1]); pagina_total = Number(m[2]); }
  }

  // Ubica la fila de encabezado de la tabla de ítems: la primera fila que tenga al menos
  // una columna reconocible como producto/descripción y otra como cantidad (REF es opcional,
  // no todas las transcripciones la separan en su propia columna).
  let headerRowIdx = -1, colRef = -1, colProducto = -1, colCantidad = -1;
  for(let r=0; r<rows.length; r++){
    const row = rows[r];
    if(!row) continue;
    let ref=-1, prod=-1, cant=-1;
    row.forEach((cell, idx) => {
      const s = cell==null ? '' : String(cell).trim();
      if(!s) return;
      if(ref<0 && /^(REF\.?|REFERENCIA)$/i.test(s)) ref = idx;
      if(prod<0 && /^(PRODUCTO|DESCRIPCI[OÓ]N)$/i.test(s)) prod = idx;
      if(cant<0 && /^(CANT\.?|CANTIDAD)$/i.test(s)) cant = idx;
    });
    if(prod>=0 && cant>=0){ headerRowIdx = r; colRef = ref; colProducto = prod; colCantidad = cant; break; }
  }

  const items = [];
  if(headerRowIdx>=0){
    for(let r=headerRowIdx+1; r<rows.length; r++){
      const row = rows[r];
      if(!row) continue;
      const producto = colProducto>=0 && row[colProducto]!=null ? String(row[colProducto]).trim() : '';
      const cantidadRaw = colCantidad>=0 ? row[colCantidad] : null;
      const cantidad = (cantidadRaw!=null && cantidadRaw!=='' && !isNaN(Number(cantidadRaw))) ? Number(cantidadRaw) : null;
      if(cantidad==null) continue; // fila en blanco, nota o texto suelto (p.ej. la leyenda) — no es un ítem
      if(/TOTAL/i.test(producto)) continue; // fila de totales al pie de la tabla — no es un ítem real
      let ref = colRef>=0 && row[colRef]!=null ? String(row[colRef]).trim() : '';
      if(!ref || /no\s*visible/i.test(ref)) ref = null; // p.ej. "(no visible)" cuando el inicio del documento viene cortado
      items.push({ref, producto, cantidad});
    }
  }

  const confianza = [radicacion, subpartida, n_factura, fecha_factura].filter(Boolean).length + (items.length ? 1 : 0);
  return {radicacion, subpartida, pagina_actual, pagina_total, n_factura, fecha_factura, items, confianza};
}

async function extractExcelDeclaracion(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const sheetName = wb.SheetNames.find(n=>/detalle/i.test(n)) || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
  const parsed = parseExcelRows(rows);
  parsed.sheetName = sheetName;
  return parsed;
}

// Reconstruye un texto legible (para "Ver texto crudo extraído" y para texto_crudo en la BD)
// a partir de los datos ya extraídos de un Excel — no hay OCR/PDF de por medio, así que no hay
// un texto "crudo" real, pero conviene guardar algo auditable con el mismo formato REF/CANT.
function excelParsedToTexto(parsed){
  const lines = [`(Leído desde un archivo Excel${parsed.sheetName ? `, hoja "${parsed.sheetName}"` : ''})`];
  if(parsed.radicacion) lines.push(`Radicación: ${parsed.radicacion}`);
  if(parsed.subpartida) lines.push(`Subpartida: ${parsed.subpartida}`);
  if(parsed.n_factura) lines.push(`Factura No.: ${parsed.n_factura}`);
  if(parsed.fecha_factura) lines.push(`Fecha factura: ${parsed.fecha_factura}`);
  lines.push('', `Ítems (${parsed.items.length}):`);
  parsed.items.forEach((it,idx)=>{
    lines.push(`${idx+1}. REF.${it.ref||'(sin ref)'} ${it.producto||''} CANT. ${it.cantidad!=null?it.cantidad:''}`);
  });
  return lines.join('\n');
}

function diOrigenLabel(tipo){
  return tipo==='pdf' ? 'PDF digital' : tipo==='excel' ? 'Excel' : 'Foto/escaneo (OCR)';
}
function diOrigenLabelShort(tipo){
  return tipo==='pdf' ? 'PDF' : tipo==='excel' ? 'Excel' : 'Foto (OCR)';
}
function diOrigenBadgeClass(tipo){
  return tipo==='pdf' ? 'info' : tipo==='excel' ? 'success' : 'neutral';
}

async function handleDiFile(file){
  if(!file) return;
  const isExcel = /\.(xlsx|xls)$/i.test(file.name) || /spreadsheet|ms-excel/i.test(file.type||'');
  const isPdf = !isExcel && (file.type === 'application/pdf' || /\.pdf$/i.test(file.name));
  const isImage = !isExcel && !isPdf && (/^image\//.test(file.type) || /\.(png|jpe?g|webp|bmp|gif|tiff?)$/i.test(file.name));
  if(!isPdf && !isImage && !isExcel){ toast('Solo se aceptan imágenes (foto/escaneo), archivos PDF o Excel (.xlsx)', 'err'); return; }

  const progressEl = document.getElementById('diProgress');
  if(progressEl){ progressEl.style.display=''; progressEl.textContent = isExcel ? 'Leyendo el Excel…' : isPdf ? 'Leyendo el PDF…' : 'Aplicando OCR a la imagen (puede tardar unos segundos)…'; }

  try{
    let parsed, texto;
    if(isExcel){
      parsed = await extractExcelDeclaracion(file);
      texto = excelParsedToTexto(parsed);
    } else if(isPdf){
      const {text} = await extractPdfText(file);
      texto = text;
      parsed = parseDeclaracionImportacion(texto);
    } else {
      texto = await extractImageTextOcr(file, (status, progress) => {
        if(progressEl) progressEl.textContent = `OCR: ${status} (${Math.round((progress||0)*100)}%)`;
      });
      parsed = parseDeclaracionImportacion(texto);
    }
    pendingLecturaDi = {
      file, tipoOrigen: isExcel ? 'excel' : (isPdf ? 'pdf' : 'foto'), texto,
      radicacion: parsed.radicacion, subpartida: parsed.subpartida,
      pagina_actual: parsed.pagina_actual, pagina_total: parsed.pagina_total,
      n_factura: parsed.n_factura, fecha_factura: parsed.fecha_factura,
      items: parsed.items, confianza: parsed.confianza, bl: '',
    };
    renderPendingLecturaDi();
    toast(isExcel ? 'Excel leído — revisa antes de guardar' : isPdf ? 'PDF leído — revisa antes de guardar' : 'OCR completado — revisa y corrige antes de guardar', 'ok');
  }catch(err){
    console.error(err);
    toast('No se pudo leer el documento: '+err.message, 'err');
  } finally {
    if(progressEl) progressEl.style.display='none';
  }
}

function confLabelDi(n){ return ['Muy baja','Baja','Media','Buena','Alta','Muy alta'][n] ?? 'Muy alta'; }

function diItemRowHtml(it, idx){
  return `<tr data-idx="${idx}">

    <td><input class="cell di-item-producto" value="${esc(it.producto||'')}" style="width:100%"></td>
    <td><input class="cell di-item-cantidad" type="number" step="1" value="${it.cantidad!=null?it.cantidad:''}" style="text-align:right;width:100%"></td>
    <td><button class="btn small danger" data-action="del-di-item" data-idx="${idx}" title="Quitar este ítem">✕</button></td>

}

function syncPendingItemsFromDom(){
  if(!pendingLecturaDi) return;
  const rows = document.querySelectorAll('#diItemsTable tbody tr[data-idx]');
  const items = [];
  rows.forEach(tr=>{
    const refEl = tr.querySelector('.di-item-ref');
    const prodEl = tr.querySelector('.di-item-producto');
    const cantEl = tr.querySelector('.di-item-cantidad');
    if(!refEl || !prodEl || !cantEl) return;
    const cantidadRaw = cantEl.value;
    items.push({ref: refEl.value.trim(), producto: prodEl.value.trim(), cantidad: cantidadRaw===''?null:Number(cantidadRaw)});
  });
  pendingLecturaDi.items = items;
}

async function saveLecturaDi(){
  if(!pendingLecturaDi) return;
  syncPendingItemsFromDom();
  const card = document.querySelector('#diPendingWrap .invoice-card');
  if(!card) return;
  const val = sel => card.querySelector(sel).value.trim();
  const radicacion = val('.di-radicacion') || null;
  const subpartida = val('.di-subpartida') || null;
  const n_factura = val('.di-nfactura') || null;
  const fecha_factura = val('.di-fecha') || null;
  const bl = val('.di-bl') || null;
  const pagina_actual = val('.di-pagina-actual') ? Number(val('.di-pagina-actual')) : null;
  const pagina_total = val('.di-pagina-total') ? Number(val('.di-pagina-total')) : null;

  const saveBtn = card.querySelector('[data-action="guardar-di"]');
  if(saveBtn) saveBtn.disabled = true;

  // 1. Subir el archivo original (foto o PDF) a Storage, para poder verificar la lectura contra
  // el documento real más adelante — igual que se hace con las facturas PDF.
  let storage_path = null;
  try{
    const path = `${Date.now()}_${pendingLecturaDi.file.name}`.replace(/[^a-zA-Z0-9._\-]/g,'_');
    const {error: upErr} = await sb.storage.from(BUCKET_DI).upload(path, pendingLecturaDi.file, {contentType: pendingLecturaDi.file.type || 'application/octet-stream'});
    if(!upErr) storage_path = path;
  }catch(err){ console.warn('No se pudo subir el archivo original a Storage', err); }

  // 2. Encabezado en impo_lecturas_di
  const header = await DB.insert('impo_lecturas_di', {
    bl, radicacion, subpartida, n_factura, fecha_factura, pagina_actual, pagina_total,
    tipo_origen: pendingLecturaDi.tipoOrigen, archivo_nombre: pendingLecturaDi.file.name,
    storage_path, texto_crudo: (pendingLecturaDi.texto||'').slice(0,20000),
    confianza: pendingLecturaDi.confianza, created_by: CURRENT_USER ? CURRENT_USER.id : null,
  });
  if(!header){ if(saveBtn) saveBtn.disabled = false; return; }

  // 3. Ítems en impo_lecturas_di_items (inserción múltiple)
  const itemsToInsert = pendingLecturaDi.items
    .filter(it => it.ref || it.producto || it.cantidad!=null)
    .map((it, idx) => ({lectura_id: header.id, orden: idx, ref: it.ref||null, producto: it.producto||null, cantidad: it.cantidad}));
  let savedItems = [];
  if(itemsToInsert.length){
    const {data, error} = await sb.from('impo_lecturas_di_items').insert(itemsToInsert).select();
    if(error){ toast('La lectura se guardó, pero hubo un error guardando los ítems: '+error.message, 'err'); console.error(error); }
    else savedItems = data || [];
  }

  STATE.lecturasDi.push(header);
  STATE.lecturasDiItems.push(...savedItems);
  pendingLecturaDi = null;
  renderPendingLecturaDi();
  renderLecturaDiHistory();
  toast('Lectura DI guardada','ok');
}

function diItemsFor(lecturaId){
  return STATE.lecturasDiItems.filter(it=>it.lectura_id===lecturaId).slice().sort((a,b)=>(a.orden||0)-(b.orden||0));
}

        <div style="display:flex;gap:8px">
          ${r.storage_path?`<button class="btn small" id="diVerOriginal">Ver original</button>`:''}
          <button class="btn small" id="diDetailClose">Cerrar</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="table-scroll"><table class="grid">
          <thead><tr><th>#</th><th>REF</th><th>Producto</th><th style="text-align:right">Cantidad</th></tr></thead>
          <tbody>${items.map((it,idx)=>`<tr><td class="mono">${idx+1}</td><td class="mono">${esc(it.ref||'—')}</td><td>${esc(it.producto||'—')}</td><td style="text-align:right" class="mono">${it.cantidad!=null?it.cantidad:'—'}</td></tr>`).join('') || `<tr><td colspan="4"><div class="empty">Sin ítems.</div></td></tr>`}</tbody>

        <p class="helptext" style="margin-top:10px">Cantidad total: ${items.reduce((s,it)=>s+(Number(it.cantidad)||0),0)} · ${items.length} ítem(s).</p>
        <details style="margin-top:10px">

          <pre style="white-space:pre-wrap;font-size:11px;max-height:260px;overflow:auto;background:var(--bg);border:1px solid var(--border);padding:10px;border-radius:6px;margin-top:8px">${esc((r.texto_crudo||'').slice(0,6000))}</pre>

    } finally { verBtn.disabled = false; }
  });
}

// Exportación a Excel/CSV — reutiliza XLSX (ya cargado para el resto de la app) para Excel, y un
// generador simple propio para CSV (con BOM UTF-8 para que Excel abra bien las tildes/eñes).
function exportRowsToXlsx(filename, rows, sheetName){
  if(!rows.length){ toast('No hay datos para exportar','err'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Datos');
  XLSX.writeFile(wb, filename);
}
function exportRowsToCsv(filename, rows){
  if(!rows.length){ toast('No hay datos para exportar','err'); return; }
  const cols = Object.keys(rows[0]);
  const escCsv = (v) => {
    if(v===null||v===undefined) return '';
    const s = String(v);
    return /[",\n;]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const lines = [cols.join(';'), ...rows.map(r=>cols.map(c=>escCsv(r[c])).join(';'))];
  const csv = '﻿' + lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function diRowsForExport(lectura){
  const items = diItemsFor(lectura.id);
  const base = {'RADICACIÓN': lectura.radicacion||'', 'SUBPARTIDA': lectura.subpartida||'', 'N° FACTURA': lectura.n_factura||'', 'FECHA': lectura.fecha_factura||'', 'BL': lectura.bl||''};
  if(!items.length) return [{...base, 'REF':'', 'PRODUCTO':'', 'CANTIDAD':''}];
  return items.map(it=>({...base, 'REF': it.ref||'', 'PRODUCTO': it.producto||'', 'CANTIDAD': it.cantidad!=null?it.cantidad:''}));
}

VIEWS.lecturadi = function(){
  const el = document.getElementById('view-lecturadi');
  el.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h2>Lectura DI</h2><div class="desc">Sube una foto/escaneo, un PDF digital, o un Excel ya transcrito de una Declaración de Importación (DIAN/MUISCA) para leer y tabular su encabezado (Radicación, Subpartida, N° Factura, Fecha) y el detalle de ítems (REF, producto, cantidad). Las fotos se procesan con reconocimiento de texto (OCR) directamente en el navegador y pueden fallar mucho con letra pequeña o apretada — si ya tienes el detalle transcrito en un Excel (con columnas tipo Referencia/Descripción/Cantidad), súbelo directamente: es el método más confiable. Un PDF digital con texto seleccionable también da mejores resultados que una foto. <strong>Revisa y corrige siempre antes de guardar</strong>, sea cual sea el origen.</div></div>
      </div>
      <div class="panel-body">
        <div class="drop-zone" id="diDrop">
          <strong>Arrastra una foto, PDF o Excel de la Declaración de Importación aquí</strong> o haz clic para seleccionar<br>
          <input type="file" id="diInput" accept="image/*,application/pdf,.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" style="display:none">
        </div>
        <p class="helptext" id="diProgress" style="display:none;margin-top:10px"></p>
        <div id="diPendingWrap" style="margin-top:16px"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><h2>Historial de lecturas</h2><div class="desc">Todas las Declaraciones de Importación guardadas, con su detalle de ítems. "Exportar todo" combina el historial completo en una sola fila por ítem (con Radicación/Subpartida/N° Factura/Fecha/BL repetidos), lista para trabajar en Excel.</div></div>
        <div style="display:flex;gap:8px">
          <button class="btn small" id="diExportAllXlsx">Exportar todo (Excel)</button>
          <button class="btn small" id="diExportAllCsv">Exportar todo (CSV)</button>
        </div>
      </div>
      <div class="panel-body flush" id="diHistoryWrap"></div>
    </div>
    <div id="diDetailWrap"></div>
    <datalist id="dlBLsDi">${STATE.embarques.map(e=>`<option value="${esc(e.bl)}">`).join('')}</datalist>
  `;

  const drop = document.getElementById('diDrop');
  const input = document.getElementById('diInput');
  drop.addEventListener('click', ()=>input.click());
  input.addEventListener('change', ()=>{ if(input.files[0]) handleDiFile(input.files[0]); input.value=''; });
  ['dragenter','dragover'].forEach(evt=>drop.addEventListener(evt, e=>{ e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt=>drop.addEventListener(evt, e=>{ e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', e=>{ const f = e.dataTransfer.files[0]; if(f) handleDiFile(f); });

  document.getElementById('diPendingWrap').addEventListener('click', (e)=>{
    if(e.target.closest('#diAddItemRow')){
      if(!pendingLecturaDi) return;
      syncPendingItemsFromDom();
      pendingLecturaDi.items.push({ref:'', producto:'', cantidad:null});
      renderPendingLecturaDi();
      return;
    }
    const delItemBtn = e.target.closest('[data-action="del-di-item"]');
    if(delItemBtn){
      syncPendingItemsFromDom();
      pendingLecturaDi.items.splice(Number(delItemBtn.dataset.idx), 1);
      renderPendingLecturaDi();
      return;
    }
    const saveBtn = e.target.closest('[data-action="guardar-di"]');
    if(saveBtn) saveLecturaDi();
    const discardBtn = e.target.closest('[data-action="descartar-di"]');
    if(discardBtn){ pendingLecturaDi = null; renderPendingLecturaDi(); }
  });

  document.getElementById('diHistoryWrap').addEventListener('click', async (e)=>{
    const verBtn = e.target.closest('[data-action="ver-di"]');
    if(verBtn){
      diSelectedId = diSelectedId === verBtn.dataset.did ? null : verBtn.dataset.did;
      renderLecturaDiHistory();
      renderDiDetail();
      return;
    }
    const xlsxBtn = e.target.closest('[data-action="export-di-xlsx"]');
    if(xlsxBtn){
      const lectura = STATE.lecturasDi.find(r=>r.id===xlsxBtn.dataset.did);
      if(lectura) exportRowsToXlsx(`Lectura_DI_${lectura.radicacion||lectura.id}.xlsx`, diRowsForExport(lectura), 'Lectura DI');
      return;
    }
    const csvBtn = e.target.closest('[data-action="export-di-csv"]');
    if(csvBtn){
      const lectura = STATE.lecturasDi.find(r=>r.id===csvBtn.dataset.did);
      if(lectura) exportRowsToCsv(`Lectura_DI_${lectura.radicacion||lectura.id}.csv`, diRowsForExport(lectura));
      return;
    }
    const delBtn = e.target.closest('[data-action="del-di"]');
    if(delBtn){
      if(!confirm('¿Eliminar esta lectura DI y todos sus ítems?')) return;
      const ok = await DB.remove('impo_lecturas_di', delBtn.dataset.did);
      if(ok){
        STATE.lecturasDi = STATE.lecturasDi.filter(r=>r.id!==delBtn.dataset.did);
        STATE.lecturasDiItems = STATE.lecturasDiItems.filter(it=>it.lectura_id!==delBtn.dataset.did);
        if(diSelectedId===delBtn.dataset.did) diSelectedId = null;
        renderLecturaDiHistory();
        renderDiDetail();
        toast('Lectura eliminada','ok');
      }
    }
  });

  document.getElementById('diExportAllXlsx').addEventListener('click', ()=>{
    const rows = STATE.lecturasDi.flatMap(diRowsForExport);
    exportRowsToXlsx(`Lecturas_DI_${todayISO()}.xlsx`, rows, 'Lecturas DI');
  });
  document.getElementById('diExportAllCsv').addEventListener('click', ()=>{
    const rows = STATE.lecturasDi.flatMap(diRowsForExport);
    exportRowsToCsv(`Lecturas_DI_${todayISO()}.csv`, rows);
  });

  renderPendingLecturaDi();
  renderLecturaDiHistory();
  renderDiDetail();
};
</script>
